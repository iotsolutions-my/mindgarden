function confirmText(){const t=T();$('confirmText').textContent={en:'Start this tower again from the beginning?',ms:'Mulakan semula menara ini dari awal?',zh:'从头重新开始这座塔？',zt:'從頭重新開始這座塔？'}[lang];
 $('confirmYes').textContent=t.retry;$('confirmNo').textContent={en:'Keep playing',ms:'Teruskan',zh:'继续玩',zt:'繼續玩'}[lang];}
$('retryBtn').addEventListener('click',confirmText);
/* ================= start ================= */
load();show('home');
window.MG_TOWER={generate,get S(){return S},get L(){return L},bfs:(...a)=>bfs(...a),startTower,goTo,dig,hint,neighbours:(x,y)=>neighbours(x,y,true),setInv:v=>{if(S)S.inv=v;},digLanding:(x,y,side)=>{if(!canStand(x,y)||isLadder(x,y))return null;const hx=x+side,hy=y+1;if(tileAt(hx,hy)!=='#'||!canEnter(hx,y)||isLadder(hx,y)||S.spike.has(hx+','+y))return null;grid[hy][hx]=' ';let fy=y;while(fy<L.h-2&&!canStand(hx,fy)&&canEnter(hx,fy+1))fy++;grid[hy][hx]='#';return S.spike.has(hx+','+fy)?null:[hx,fy];},tick:(n,dt)=>{for(let i=0;i<n&&S&&!S.over;i++)update(dt||16);},prog:()=>prog};
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
