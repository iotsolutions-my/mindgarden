/* ===== MindGarden 3.19.0 shell: app bar, home menu, settings, game upgrades ===== */
:root{--ink:#1f3a31;--deep:#164c3c;--leaf:#2e7d5b;--mint:#e7f3ea;--paper:#fbfdf9;--line:#d5e5d8;--sun:#f0a94f;--bad:#c4473d;--good:#2e865f}
html.ts-l{font-size:19px}html.ts-xl{font-size:21px}
:root{font-size:17px}html.ts-l:root{font-size:19px}html.ts-xl:root{font-size:21px}
body{background:#f2f7ef}
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px max(14px,calc((100vw - 1020px)/2 + 14px));background:var(--deep);color:#fff;box-shadow:0 2px 12px #0003}
.appbar .brand-link{color:#fff;text-decoration:none;font-weight:850;font-size:1.25rem;display:flex;align-items:center;gap:6px;margin-right:auto;white-space:nowrap}
.appbar button{border:0;border-radius:14px;min-height:48px;padding:8px 14px;font-weight:750;background:#ffffff1f;color:#fff;display:flex;align-items:center;gap:6px}
.appbar button:hover{background:#ffffff33}
.appbar button[hidden],.appbar [hidden]{display:none!important}
.appbar .bar-title{font-weight:800;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto;max-width:48vw}
.view[hidden]{display:none!important}
.wrap{padding-top:16px}
/* Home */
.welcome{background:linear-gradient(135deg,#1b5a45,#2f7d5c 60%,#4b9667);color:#fff;border-radius:24px;padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.welcome::after{content:"🌿";position:absolute;right:-6px;bottom:-22px;font-size:7rem;opacity:.16;transform:rotate(-12deg)}
.welcome h1{margin:0 0 4px;font-size:1.55rem}.welcome p{margin:4px 0 0;line-height:1.55;color:#eaf7ea;max-width:760px}

.chip{display:inline-flex;align-items:center;gap:6px;background:#ffffff26;border:1px solid #ffffff40;color:#fff;border-radius:99px;padding:7px 13px;font-weight:700;text-decoration:none;font-size:.95rem}
button.chip{min-height:44px}
.today{background:#fff;border:2px solid #f2d39d;border-radius:22px;padding:16px;margin-bottom:18px;box-shadow:0 6px 20px #8a6a2412}
.today-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.today-head h2{margin:0;font-size:1.25rem;color:#5a3d0e}
.streak{background:#fff3dc;color:#7a4b00;border-radius:99px;padding:6px 12px;font-weight:800}
.today-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.today-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;text-decoration:none;color:var(--ink);background:#fffaf0;border:2px solid #f3e1bd;border-radius:18px;padding:12px 6px;font-weight:750;min-height:110px;justify-content:center;position:relative}
.today-item .e{font-size:2rem}
.today-item.done{background:#eaf7ee;border-color:#9fd2b2}
.today-item.done::after{content:"✓";position:absolute;top:6px;right:8px;background:var(--good);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:.9rem}
.today-bar{height:10px;background:#f5ead6;border-radius:9px;margin-top:12px;overflow:hidden}.today-bar i{display:block;height:100%;background:linear-gradient(90deg,#f0a94f,#2e865f);border-radius:9px;transition:width .5s}
.today-note{margin:8px 0 0;color:#6b5a3a;font-size:1rem}
.cat-nav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;position:sticky;top:68px;z-index:20;background:#f2f7ef}
.cat-nav::-webkit-scrollbar{display:none}
.cat-nav a{flex:0 0 auto;text-decoration:none;color:var(--deep);background:#fff;border:2px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:750;white-space:nowrap}
.cat{margin:6px 0 22px;scroll-margin-top:130px}
.cat h2{font-size:1.25rem;margin:4px 0 10px;color:var(--deep);display:flex;align-items:center;gap:8px}
.cat h2{flex-wrap:wrap;row-gap:0}.cat h2 small{flex-basis:100%;font-size:.95rem;font-weight:600;color:#5d7468}
.tilegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gtile{--c:#2e7d5b;display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;min-height:118px;box-shadow:0 3px 12px #1d4b3a0d;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.gtile:hover,.gtile:focus-visible{transform:translateY(-2px);box-shadow:0 8px 22px #1d4b3a1f;border-color:var(--c)}
.gtile .badge{flex:0 0 auto;width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:1.9rem;background:color-mix(in srgb,var(--c) 16%,#fff);border:2px solid color-mix(in srgb,var(--c) 35%,#fff)}
.gtile .gt{font-weight:850;font-size:1.12rem;display:block;margin-bottom:3px}
.gtile .gd{display:block;color:#4b6357;line-height:1.4;font-size:.98rem}
.gtile .gm{display:inline-block;margin-top:7px;font-size:.88rem;font-weight:750;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:99px;padding:3px 10px}
.gtile.ext .gm::after{content:" ↗"}
.home-foot{text-align:center;color:#4f685b;line-height:1.6;padding:10px 6px 30px;font-size:1rem}
.home-foot a{color:var(--leaf)}
/* Settings */
.set-card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.set-card h2{margin:0 0 4px;font-size:1.2rem;color:var(--deep)}
.set-card p{margin:0 0 10px;color:#4b6357;line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:58px;border:2px solid var(--line);background:#f8fbf6;border-radius:16px;font-weight:800;color:var(--ink);padding:8px 6px;line-height:1.25}
.seg button small{display:block;font-weight:600;font-size:.82rem;color:#566e62;margin-top:3px}
.seg button[aria-pressed=true]{border-color:var(--leaf);background:#dcf2e3;box-shadow:inset 0 0 0 2px var(--leaf)}
.seg .ts-btn-m{font-size:1rem}.seg .ts-btn-l{font-size:1.15rem}.seg .ts-btn-xl{font-size:1.3rem}
.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats-grid div{background:var(--mint);border-radius:14px;padding:10px;text-align:center;font-weight:700}
.stats-grid b{display:block;font-size:1.5rem;color:var(--deep)}
/* Game view header */
.play-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.mode-chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:750;color:var(--deep);min-height:44px}
.panel{border-radius:24px}
/* Celebration */
.petals{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.petals span{position:absolute;top:-40px;font-size:1.6rem;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:.2}}
.feedback{min-height:1.6em;font-weight:800;font-size:1.12rem}
.feedback.win{color:var(--good);animation:pop .45s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.option.wrong,.hunt-choice.wrong{background:#fbe3df!important;border-color:var(--bad)!important;color:#7e2a22!important;animation:shake .35s;opacity:.85}
.option.right,.hunt-choice.right{background:#d5f1df!important;border-color:var(--good)!important;color:#145236!important;box-shadow:0 0 0 3px #9fd8b5}
/* Word Trails */
.wordboard{position:relative}
.wordline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.wordline polyline{fill:none;stroke:#2e865f;stroke-opacity:.42;stroke-width:.16;stroke-linecap:round;stroke-linejoin:round}
.wordline circle{fill:#2e865f;fill-opacity:.5}
.wordcell.next{border-color:#f0aa5e;box-shadow:0 0 0 2px #f6c991 inset}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.slot{width:clamp(36px,9vw,50px);height:clamp(44px,11vw,58px);border:2px dashed #9cc5ad;border-radius:12px;display:grid;place-items:center;font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:850;background:#fff;color:var(--deep)}
.slot.filled{border-style:solid;border-color:var(--good);background:#e4f6ea;animation:pop .25s}
.slots.win .slot{background:#c9efd6;border-color:#1f7a4f}
.slots.bad .slot{border-color:var(--bad);background:#fbe3df;animation:shake .35s}
/* Memory Garden */
.memory-grid{perspective:800px}
.memcard{background:linear-gradient(135deg,#3d8b66,#1f6247)!important;color:#fff;border:3px solid #1b5a41!important;box-shadow:0 4px 10px #0002;font-size:clamp(1.6rem,6vw,2.3rem)!important;transition:transform .2s}
.memcard:not(.open):not(.matched){background-image:radial-gradient(circle at 30% 30%,#ffffff22 0 12%,transparent 13%),radial-gradient(circle at 70% 70%,#ffffff1a 0 10%,transparent 11%),linear-gradient(135deg,#3d8b66,#1f6247)!important}
.memcard.open{background:#fffdf5!important;border-color:#e3c27b!important;color:inherit}
.memcard.matched{background:#e1f6e8!important;border-color:#62b386!important;opacity:.9}
.memcard.flipnow{animation:flip .32s ease}
.memcard.matched.flipnow{animation:pop .4s}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.mem-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.mem-stats span{background:var(--mint);border-radius:99px;padding:6px 12px;font-weight:750}
/* Number Steps */
.diffs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.diffs span{background:#fff3dc;color:#7a4b00;border-radius:99px;padding:4px 10px;font-weight:800;font-size:.95rem}
.numcell.blank.solved{background:#d5f1df;border-color:var(--good);animation:pop .4s}
/* Sharp Eyes */
.observe .item{transition:transform .2s}
.observe .item.gone{background:#fff3dc;border:2px dashed var(--sun);animation:pop .4s}
/* Logic Squares */
.logic-cell.peer{background:#eef7f0}
.logic-cell.same{background:#fff1d6;font-weight:900}
.logic-cell.selected{background:#ffe2a8!important;box-shadow:inset 0 0 0 3px #e39a35}
.logic-cell.clash{color:var(--bad)!important;background:#fde6e2!important}
.logic-cell:not(.given){color:#2160a8}
.logic-numbers .option.full{opacity:.4}
.logic-left{text-align:center;font-weight:750;color:#4b6357;margin:6px 0}
/* Gem Garden */
.gem-wrap{max-width:460px;margin:auto}
.gem-score{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:8px 0}
.gem-progress{height:12px;border-radius:9px;background:#e6efe4;overflow:hidden;margin-bottom:10px}.gem-progress i{display:block;height:100%;background:linear-gradient(90deg,#9b5de5,#f0a94f,#2e865f);transition:width .4s}
.gem-tile{transition:transform .15s;position:relative}
.gem-tile.gem-selected{transform:scale(1.1);z-index:2}
.gem-tile.pop{animation:gempop .3s forwards}
.gem-tile.drop{animation:gemdrop .28s ease-out}
.gem-tile.gem-hint{animation:hintpulse 1s infinite}
@keyframes gempop{50%{transform:scale(1.25);filter:brightness(1.5)}100%{transform:scale(0);opacity:0}}
@keyframes gemdrop{from{transform:translateY(-60%);opacity:.3}to{transform:none;opacity:1}}
@keyframes hintpulse{50%{box-shadow:0 0 0 5px #f0a94f}}
.combo{display:inline-block;background:#9b5de5;color:#fff;border-radius:99px;padding:3px 12px;margin-left:6px;animation:pop .35s}

.air-field{background:radial-gradient(circle at 50% 108%,#1f6a55 0,#0f3d33 55%,#0a2c25 100%)!important;border:3px solid #0b2a23!important;position:relative}

.air-field.paused::before{animation-play-state:paused;opacity:.35}
.air-field::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 108%,transparent 0 24%,#7cf2b81f 24.4% 25%,transparent 25.4% 48%,#7cf2b81f 48.4% 49%,transparent 49.4% 72%,#7cf2b81f 72.4% 73%,transparent 73.4%);pointer-events:none}
@keyframes sweep{to{transform:rotate(360deg)}}
.air-lane{background:repeating-linear-gradient(180deg,transparent 0 calc(100%/6 - 1px),#7cf2b826 calc(100%/6 - 1px) calc(100%/6))!important;border:2px dashed #7cf2b84d!important;position:relative;z-index:1}

.air-plane.low{border-color:#ffb347!important;box-shadow:0 0 14px #ffb347aa!important}
.air-plane.ok{border-color:#9be7a9!important;opacity:.85}
.air-plane[aria-pressed=true]{outline:4px solid #ffd166!important;transform:scale(1.08)}

function logicPuzzle(mode){const n=mode==='expert'?6:4, bh=mode==='expert'?2:2,bw=n/bh;let rows=Array.from({length:n},(_,i)=>i), cols=[...rows], digits=[...rows].map(v=>v+1);const shuffleBlocks=(arr,size)=>shuffle(Array.from({length:arr.length/size},(_,i)=>i)).flatMap(b=>shuffle(arr.slice(b*size,(b+1)*size)));rows=shuffleBlocks(rows,bh);cols=shuffleBlocks(cols,bw);digits=shuffle(digits);const answer=rows.flatMap(r=>cols.map(c=>digits[(bw*(r%bh)+Math.floor(r/bh)+c)%n]));let board=[...answer];let order=shuffle(Array.from({length:n*n},(_,i)=>i));let keep=mode==='relax'?Math.round(n*n*.68):mode==='gentle'?Math.round(n*n*.56):mode==='challenge'?Math.round(n*n*.44):Math.round(n*n*.43);let blanks=n*n-keep,removed=0;for(const i of order){if(removed>=blanks)break;const v=board[i];board[i]=0;if(logicCount(board,n,bh,bw)===1)removed++;else board[i]=v}return {n,bh,bw,board,answer,initial:[...board]}}

const chooseBoard=(word,mode)=>{

  const used=new Set(),path=[];
  function dfs(i){if(path.length===chars.length)return true;for(const j of (i<0?shuffle(Array.from({length:all},(_,k)=>k)):near(i))){if(used.has(j))continue;used.add(j);path.push(j);if(dfs(j))return true;path.pop();used.delete(j)}return false}
  if(dfs(-1)){

    const tiles=Array.from({length:all},()=>alphabet[rand(alphabet.length)]);

    const distract=mode==='relax'?['日','月','天','人','心','水','火','木','田','山','大','中']:['理','治','策','略','安','全','數','據','業','術','經','營','方','案','學','知'];

function findMatches(a,n=6){let set=new Set();for(let r=0;r<n;r++)for(let c=0;c<n;c++){let i=r*n+c;if(c<=n-3&&a[i]===a[i+1]&&a[i]===a[i+2]){let j=c;while(j<n&&a[r*n+j]===a[i])set.add(r*n+j++);}if(r<=n-3&&a[i]===a[i+n]&&a[i]===a[i+2*n]){let j=r;while(j<n&&a[j*n+c]===a[i])set.add(j++*n+c);}}return [...set]}
function gemBoard(){let a=[];for(let i=0;i<36;i++){let choices=shuffle([0,1,2,3,4,5]).filter(v=>!(i%6>1&&a[i-1]===v&&a[i-2]===v)&&!(i>=12&&a[i-6]===v&&a[i-12]===v));a.push(choices[0]);}return a}

 if(tool==='bulldoze'){

function logicValid(q){return q.board.every((v,i)=>v&&logicOk(q.board,q.n,q.bh,q.bw,i,v))}

function logicFill(n,bh,bw,diag){const a=Array(n*n).fill(0);const ok=(i,v)=>{if(!logicOk(a,n,bh,bw,i,v))return false;if(!diag)return true;const r=Math.floor(i/n),c=i%n;for(let k=0;k<n;k++){if(r===c&&k!==r&&a[k*n+k]===v)return false;if(r+c===n-1&&k!==r&&a[k*n+(n-1-k)]===v)return false}return true};
 (function go(){const i=a.indexOf(0);if(i<0)return true;for(const v of shuffle(Array.from({length:n},(_,k)=>k+1)))if(ok(i,v)){a[i]=v;if(go())return true;a[i]=0}return false})();return a}
function logicDiagOk(a,n,i,v){const r=Math.floor(i/n),c=i%n;for(let k=0;k<n;k++){if(r===c&&k!==r&&a[k*n+k]===v)return false;if(r+c===n-1&&k!==r&&a[k*n+(n-1-k)]===v)return false}return true}
function logicCountX(b,n,bh,bw,diag,limit=2){const a=b.slice();let count=0;(function go(){if(count>=limit)return;const i=a.indexOf(0);if(i<0){count++;return}for(let v=1;v<=n;v++)if(logicOk(a,n,bh,bw,i,v)&&(!diag||logicDiagOk(a,n,i,v))){a[i]=v;go();a[i]=0;if(count>=limit)return}})();return count}
function logicPuzzleX(mode){const n=mode==='expert'?6:4,bh=2,bw=n/bh,diag=mode==='challenge'||mode==='expert';const answer=logicFill(n,bh,bw,diag);const board=answer.slice();const keep=Math.round(n*n*({relax:.68,gentle:.56,challenge:.40,expert:.36}[mode]||.5));let removed=0;for(const i of shuffle(Array.from({length:n*n},(_,k)=>k))){if(removed>=n*n-keep)break;const v=board[i];board[i]=0;if(logicCountX(board,n,bh,bw,diag)===1)removed++;else board[i]=v}return {n,bh,bw,diag,board,answer,initial:board.slice()}}
function logicValidX(q){return q.board.every((v,i)=>v&&logicOk(q.board,q.n,q.bh,q.bw,i,v)&&(!q.diag||logicDiagOk(q.board,q.n,i,v)))}

// Check for new releases without interrupting the current puzzle.
(function(){
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  var ownBuild = document.querySelector('meta[name="mindgarden-build"]')?.content || '';
  var lastCheck = 0, offeredBuild = '';
  var labels = {
    en:['A new MindGarden update is ready.','Update now','Later'],
    ms:['Kemas kini MindGarden tersedia.','Kemas kini','Nanti'],
    zh:['MindGarden 有新版本可用。','立即更新','稍后'],
    zt:['MindGarden 有新版本可用。','立即更新','稍後']
  };
  function showUpdate(build){
    if (!build || build === ownBuild || offeredBuild === build) return;
    offeredBuild=build;
    var old=document.getElementById('mindgarden-update'); if(old)old.remove();
    var lang=window.MG_LANG || 'en', t=labels[lang]||labels.en;
    var bar=document.createElement('aside');bar.id='mindgarden-update';
    bar.setAttribute('role','status');
    bar.style.cssText='position:fixed;z-index:9999;bottom:12px;left:12px;right:12px;margin:auto;max-width:540px;padding:14px;border-radius:15px;background:#174b3a;color:white;box-shadow:0 4px 24px #0004;font:600 16px system-ui;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between';
    var msg=document.createElement('span');msg.textContent=t[0];bar.appendChild(msg);
    var now=document.createElement('button');now.textContent=t[1];now.style.cssText='border:0;border-radius:10px;background:#fff;color:#174b3a;padding:11px 15px;font:inherit;cursor:pointer';
    now.onclick=async function(){
      try { if('serviceWorker' in navigator) {var reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();} }catch(e){}
      // Fresh network navigation; the old service worker uses network-first for pages.
      var url=new URL(location.href); url.searchParams.set('mg-build',build);location.replace(url.toString());
    };
    var later=document.createElement('button');later.textContent=t[2];later.style.cssText='border:1px solid #ffffff99;border-radius:10px;background:transparent;color:white;padding:11px 15px;font:inherit;cursor:pointer';later.onclick=function(){bar.remove()};
    bar.appendChild(now);bar.appendChild(later);document.body.appendChild(bar);
  }
  async function checkUpdates(){
    if(!navigator.onLine || Date.now()-lastCheck<60000) return;
    lastCheck=Date.now();
    try{
      var response=await fetch('./version.json',{cache:'no-store'});
      if(!response.ok)return;
      var data=await response.json();
      if(data.build && data.build!==ownBuild) showUpdate(String(data.build));
      if('serviceWorker' in navigator){var reg=await navigator.serviceWorker.getRegistration();if(reg)reg.update().catch(function(){});}
    }catch(e){/* Offline is normal for a PWA. */}
  }
  window.addEventListener('load',checkUpdates);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)checkUpdates()});
  window.addEventListener('online',checkUpdates);
  window.addEventListener('focus',checkUpdates);
  // Periodic check while open, but never force a mid-puzzle reload.
  setInterval(function(){if(!document.hidden)checkUpdates()},20*60*1000);
})();

// MindGarden v3.12.0 optional PWA installation; the games work without installation.
(function(){
  if (!('serviceWorker' in navigator)) return;
  if (!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./service-worker.js').catch(function(err){console.warn('MindGarden offline mode unavailable:',err);}); });
  var pendingPrompt=null;
  var strip=document.getElementById('install-strip'), button=document.getElementById('install-button'), dismiss=document.getElementById('install-dismiss'), label=document.getElementById('install-text');
  if (!strip || !button) return;
  function hide(){strip.hidden=true;}
  window.addEventListener('beforeinstallprompt',function(event){
    event.preventDefault();pendingPrompt=event;window.MG_INSTALL=async function(){if(!pendingPrompt)return;var p=pendingPrompt;pendingPrompt=null;window.MG_INSTALL=null;hide();var c=document.getElementById('install-card');if(c)c.hidden=true;await p.prompt();};var card=document.getElementById('install-card');if(card)card.hidden=false;
    if (sessionStorage.getItem('mindgarden-install-dismissed')!=='1') {strip.hidden=false;label.textContent=SH[state.lang].installP;button.textContent=SH[state.lang].installB;}
  });
  button.addEventListener('click',async function(){
    if (!pendingPrompt) return;
    var prompt=pendingPrompt;pendingPrompt=null;hide();
    await prompt.prompt();
  });
  dismiss.addEventListener('click',function(){hide();try{sessionStorage.setItem('mindgarden-install-dismissed','1')}catch(e){};});
  window.addEventListener('appinstalled',hide);
})();
