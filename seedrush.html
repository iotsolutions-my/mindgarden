<script>
/* MindGarden Seed Rush — maze levels. Deterministic (integer RNG), validated reachable. */
'use strict';
var MazeGen=(function(){
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // up right down left
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
/* Level settings: one difficulty curve for everyone. */
function params(n,daily){const big=!daily&&n%10===0;
 return {n,big,W:n<=20?15:19,H:n<=20?19:(big?27:23),robots:Math.min(8,2+Math.floor(n/12)+(big?1:0)),
  chase:0.80+0.15*Math.min(1,(n-1)/99),patrol:0.62,scared:Math.max(2.5,7-n*0.045),alert:5+Math.floor(n/25),maxPack:n<30?2:3,
  loops:0.04+Math.min(0.10,n*0.0012),tunnel:n>=4,mud:n>=10,oneway:n>=16,tele:n>=20?(n>=50?2:1):0,gates:n>=30?(n>=60?4:2):0,dark:n>=40&&n%5===0,
  shed:n>=12,powers:['boots','freeze','shield','magnet'].filter((p,i)=>n>=[6,13,25,35][i]),symmetric:n<=60||n%3!==0,
  challenge:['robots','fruit','time'][n%3],eatGoal:1+Math.floor(n/30)};}
function build(n,daily){const p=params(daily?30+(n%61):n,daily);const r=rng(daily?n*2654435761:n*7919+101);
 const W=p.W,H=p.H,wc=(W-1)/2,hc=(H-1)/2;
 for(let attempt=0;attempt<40;attempt++){const g=carve(p,r,W,H,wc,hc);if(g)return Object.assign(g,{params:p,W,H,n,daily:!!daily});}
 throw new Error('maze generation failed '+n);}
function carve(p,r,W,H,wc,hc){
 const G=Array.from({length:H},()=>Array(W).fill('#'));
 const sym=p.symmetric,maxX=sym?wc:W-2;
 // perfect maze on cells (odd coordinates); left half when symmetric
 const seen=new Set(),stack=[[1,1]];seen.add('1,1');G[1][1]='.';
 while(stack.length){const [x,y]=stack[stack.length-1];const opts=[];
  for(const [dx,dy] of DIRS){const nx=x+dx*2,ny=y+dy*2;if(nx<1||ny<1||nx>maxX||ny>H-2||seen.has(nx+','+ny))continue;opts.push([nx,ny,dx,dy]);}
  if(!opts.length){stack.pop();continue;}const [nx,ny,dx,dy]=opts[Math.floor(r()*opts.length)];G[y+dy][x+dx]='.';G[ny][nx]='.';seen.add(nx+','+ny);stack.push([nx,ny]);}
 const mirror=()=>{if(!sym)return;for(let y=0;y<H;y++)for(let x=wc+1;x<W;x++)G[y][x]=G[y][W-1-x];};mirror();
 const isCellLink=(x,y)=>(x%2)!==(y%2); // a wall between two cells
 const set=(x,y,v)=>{G[y][x]=v;if(sym)G[y][W-1-x]=v;};
 // robot dock in the centre, with a ring road around it
 for(let y=hc-2;y<=hc+2;y++)for(let x=wc-4;x<=wc+4;x++){const ring=y===hc-2||y===hc+2||x===wc-4||x===wc+4;G[y][x]=ring?'.':'#';}
 for(let x=wc-2;x<=wc+2;x++)G[hc][x]='H';G[hc-1][wc]='D';
 // remove dead ends (braid) and add extra loops — symmetric
 const open=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&G[y][x]!=='#';
 const core=(x,y)=>y>=hc-2&&y<=hc+2&&x>=wc-4&&x<=wc+4;
 for(let pass=0;pass<4;pass++)for(let y=1;y<H-1;y+=2)for(let x=1;x<W-1;x+=2){if(G[y][x]!=='.'||core(x,y))continue;
  const n=DIRS.filter(([dx,dy])=>open(x+dx,y+dy)).length;if(n>1)continue;
  const cand=DIRS.filter(([dx,dy])=>{const wx=x+dx,wy=y+dy,bx=x+dx*2,by=y+dy*2;return wx>0&&wy>0&&wx<W-1&&wy<H-1&&G[wy][wx]==='#'&&open(bx,by)&&!core(wx,wy)&&!(G[by]&&(G[by][bx]==='H'||G[by][bx]==='D'));});
  if(cand.length){const [dx,dy]=cand[Math.floor(r()*cand.length)];set(x+dx,y+dy,'.');}}
 for(let y=1;y<H-1;y++)for(let x=1;x<=(sym?wc:W-2);x++){if(G[y][x]!=='#'||!isCellLink(x,y)||core(x,y))continue;
  const h=x%2===0;const a=h?[x-1,y]:[x,y-1],b=h?[x+1,y]:[x,y+1];if(open(...a)&&open(...b)&&r()<p.loops&&!core(...a)&&!core(...b))set(x,y,'.');}
 // join any separated parts
 for(let guard=0;guard<50;guard++){const comp=components(G,W,H);if(comp.count<=1)break;
  let joined=false;for(let y=1;y<H-1&&!joined;y++)for(let x=1;x<W-1&&!joined;x++){if(G[y][x]!=='#'||!isCellLink(x,y)||core(x,y))continue;const h=x%2===0;const a=h?[x-1,y]:[x,y-1],b=h?[x+1,y]:[x,y+1];
   const ca=comp.id[a[1]*W+a[0]],cb=comp.id[b[1]*W+b[0]];if(ca>=0&&cb>=0&&ca!==cb){set(x,y,'.');joined=true;}}
  if(!joined)return null;}
 // tunnel (wraps left/right)
 let tunnel=-1;if(p.tunnel&&r()<0.75){const rows=[];for(let y=3;y<H-3;y+=2)if(Math.abs(y-hc)>2&&G[y][1]==='.')rows.push(y);if(rows.length){tunnel=rows[Math.floor(r()*rows.length)];G[tunnel][0]='T';G[tunnel][W-1]='T';}}
 const start={x:wc,y:hc+4};if(G[start.y][start.x]!=='.')return null;
 const idx=(x,y)=>y*W+x;
 const L={G,W,H,wc,hc,tunnel,start,door:{x:wc,y:hc-1},dock:{x:wc,y:hc},mud:new Set(),arrows:new Map(),gates:[],tele:new Map()};
 const pathTiles=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(G[y][x]==='.'&&!core(x,y)&&!(x===start.x&&y===start.y))pathTiles.push([x,y]);
 const deg=(x,y)=>DIRS.filter(([dx,dy])=>open(x+dx,y+dy)&&G[y+dy][x+dx]!=='H'&&G[y+dy][x+dx]!=='D').length;
 const corridor=([x,y])=>deg(x,y)===2&&((open(x-1,y)&&open(x+1,y))||(open(x,y-1)&&open(x,y+1)));
 const farFromStart=([x,y])=>Math.abs(x-start.x)+Math.abs(y-start.y)>4;
 const pick=(list)=>list.splice(Math.floor(r()*list.length),1)[0];
 // mud patches
 if(p.mud){let c=pathTiles.filter(t=>corridor(t)&&farFromStart(t));for(let k=0;k<3+Math.floor(p.n/25)&&c.length;k++){const [x,y]=pick(c);L.mud.add(idx(x,y));if(sym)L.mud.add(idx(W-1-x,y));}}
 // one-way paths (kept only if every place can still be reached and left)
 if(p.oneway){let c=pathTiles.filter(t=>corridor(t)&&farFromStart(t)&&!L.mud.has(idx(...t)));let made=0;
  for(let k=0;k<20&&made<2+Math.floor(p.n/30)&&c.length;k++){const [x,y]=pick(c);const horiz=open(x-1,y)&&open(x+1,y);const d=horiz?(r()<0.5?1:3):(r()<0.5?0:2);
   L.arrows.set(idx(x,y),d);if(!stronglyConnected(L))L.arrows.delete(idx(x,y));else made++;}}
 // teleport pads
 let teleTries=0;for(let k=0;k<p.tele;k++){const padNear=t=>[...L.tele.keys()].some(k=>Math.abs(k%W-t[0])+Math.abs(((k/W)|0)-t[1])<3);const c=pathTiles.filter(t=>corridor(t)&&farFromStart(t)&&!L.mud.has(idx(...t))&&!L.arrows.has(idx(...t))&&!padNear(t));if(c.length<2)break;
  const a=pick(c);const far=c.filter(t=>Math.abs(t[0]-a[0])+Math.abs(t[1]-a[1])>(W+H)/2&&Math.abs(t[0]-a[0])+Math.abs(t[1]-a[1])>=3);if(!far.length)break;const b=far[Math.floor(r()*far.length)];L.tele.set(idx(...a),idx(...b));L.tele.set(idx(...b),idx(...a));if(!stronglyConnected(L,false,true)){L.tele.delete(idx(...a));L.tele.delete(idx(...b));k--;if(++teleTries>12)break;}}
 // timed gates on link tiles that are never needed (the maze stays connected with all gates closed)
 if(p.gates){let c=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(G[y][x]==='.'&&isCellLink(x,y)&&!core(x,y)&&farFromStart([x,y])&&!L.arrows.has(idx(x,y))&&!L.mud.has(idx(x,y))&&!L.tele.has(idx(x,y)))c.push([x,y]);
  for(let k=0;k<30&&L.gates.length<p.gates&&c.length;k++){const [x,y]=pick(c);L.gates.push({i:idx(x,y),x,y,phase:L.gates.length*1.7});if(!stronglyConnected(L,true,true))L.gates.pop();}}
 // power flowers near the four corners, seeds everywhere else
 const flowers=new Set();for(const [cx,cy] of [[1,3],[W-2,3],[1,H-4],[W-2,H-4]]){let best=null,bd=1e9;for(const [x,y] of pathTiles){const d=Math.abs(x-cx)+Math.abs(y-cy);if(d<bd&&!L.tele.has(idx(x,y))){bd=d;best=[x,y];}}if(best)flowers.add(idx(...best));}
 L.flowers=flowers;L.seeds=new Set();for(const [x,y] of pathTiles){const i=idx(x,y);if(!flowers.has(i)&&!L.tele.has(i))L.seeds.add(i);}
 for(let y=hc-2;y<=hc+2;y++)for(let x=wc-4;x<=wc+4;x++)if(G[y][x]==='.'&&!flowers.has(idx(x,y)))L.seeds.add(idx(x,y));
 if(!stronglyConnected(L,true)||!stronglyConnected(L,true,true))return null;
 // robot zones: spread centres across the maze (farthest-point sampling)
 const centres=[pathTiles[Math.floor(r()*pathTiles.length)]];while(centres.length<p.robots){let best=null,bd=-1;for(const t of pathTiles){const d=Math.min(...centres.map(c=>Math.abs(c[0]-t[0])+Math.abs(c[1]-t[1])));if(d>bd){bd=d;best=t;}}centres.push(best);}
 L.zoneOf=new Int8Array(W*H).fill(-1);for(const [x,y] of pathTiles){let bi=0,bd=1e9;centres.forEach((c,i)=>{const d=Math.abs(c[0]-x)+Math.abs(c[1]-y);if(d<bd){bd=d;bi=i;}});L.zoneOf[idx(x,y)]=bi;}
 L.zones=centres.map((c,i)=>({cx:c[0],cy:c[1],tiles:pathTiles.filter(([x,y])=>L.zoneOf[idx(x,y)]===i).map(([x,y])=>idx(x,y))}));
 return L;}
function components(G,W,H){const id=new Int32Array(W*H).fill(-1);let count=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(G[y][x]!=='.'||id[y*W+x]>=0)continue;const q=[[x,y]];id[y*W+x]=count;
  while(q.length){const [cx,cy]=q.pop();for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;if(G[ny][nx]!=='.'||id[ny*W+nx]>=0)continue;id[ny*W+nx]=count;q.push([nx,ny]);}}count++;}

// Tap-to-go: walk the shortest path to the tapped tile, re-planned at every tile (gates open and close).

function steerToGoal(p){const here=idx(p.x,p.y);if(here===p.goal){p.goal=-1;p.want=p.dir;return;}
 const D=goalField(p);let best=-1,bd=1e9;for(let d=0;d<4;d++){const s=step(p.x,p.y,d,'player');if(!s)continue;const v=D[idx(s[0],s[1])];if(v>=0&&v<bd){bd=v;best=d;}}
 p.want=best;}
function reachFrom(x0,y0){const R=new Uint8Array(L.W*L.H),q=[idx(x0,y0)];R[q[0]]=1;for(let qi=0;qi<q.length;qi++){const u=q[qi],ux=u%L.W,uy=(u/L.W)|0;

function setGoalAt(fx,fy){if(!S||S.state!=='play'||S.over)return;const p=S.p;const R=reachFrom(p.x,p.y);

 for(let y=Math.max(0,cy-3);y<=Math.min(L.H-1,cy+3);y++)for(let x=Math.max(0,cx-3);x<=Math.min(L.W-1,cx+3);x++){if(!R[idx(x,y)])continue;const d=(x+.5-fx)**2+(y+.5-fy)**2;if(d<bd){bd=d;best=idx(x,y);}}

  const ahead=D[idx(nx,ny)],back=D[idx(p.x,p.y)];if(back>=0&&(ahead<0||ahead>back))want((p.dir+2)%4);}

function checkFruit(){const f=S.eaten/S.total;for(const [k,th] of [[0,0.3],[1,0.7]])if(!S.fruitDone[k]&&f>=th){S.fruitDone[k]=true;S.fruit={i:idx(L.start.x,L.start.y),until:S.clock+10000,kind:(S.n+k)%4};}}

/* ---------- robots ---------- */
function nearestPath(x,y){x=Math.max(1,Math.min(L.W-2,Math.round(x)));y=Math.max(1,Math.min(L.H-2,Math.round(y)));let best=null,bd=1e9;

function robotTarget(r){const p=S.p;

  const lead=S.robots.find(o=>o.mode==='chase'&&o.role===0&&!o.eyes)||r;return nearestPath(2*p.x-lead.x+dx*2,2*p.y-lead.y+dy*2)||[p.x,p.y];}

function robotDecide(r){if(S.clock<S.freezeUntil||S.clock<S.readyUntil)return false;

 const opts=[];for(let d=0;d<4;d++){if(d===(r.dir+2)%4&&r.moving!==null)continue;if(step(r.x,r.y,d,who))opts.push(d);}

 if(scared){const D=distField(S.p.x,S.p.y,'robot');let best=-1;for(const d of opts){const s=step(r.x,r.y,d,who);const v=D[idx(s[0],s[1])];const sc=(v<0?99:v)+Math.random()*1.5;if(sc>best){best=sc;choice=d;}}}

function robotArrive(r){if(r.mode==='leave'&&L.G[r.y][r.x]==='.'){r.mode='patrol';}

function pathDist(a,b){const D=distField(b.x,b.y,'player');const v=D[idx(a.x,a.y)];return v<0?99:v;}
function updateAlerts(){const P=L.params,p=S.p;if(S.clock<S.hidden)return;

function freeTiles(minDist){const out=[];const D=distField(S.p.x,S.p.y,'player');for(let y=1;y<L.H-1;y++)for(let x=1;x<L.W-1;x++){const i=idx(x,y);if(L.G[y][x]!=='.'||L.tele.has(i)||L.arrows.has(i)||S.gateAt.has(i))continue;

function update(dt){if(S.over)return;S.clock+=dt;const p=S.p;

 if(S.p&&S.p.goal>=0){const gx=S.p.goal%L.W,gy=(S.p.goal/L.W)|0,pulse=.5+.5*Math.sin(now/160);ctx.strokeStyle=`rgba(214,64,52,${.55+.35*pulse})`;ctx.lineWidth=Math.max(2,s*.12);ctx.beginPath();ctx.arc(X(gx)+s/2,Y(gy)+s/2,s*(.32+.08*pulse),0,7);ctx.stroke();}
 // robots
 const scaredT=S.scaredUntil-S.clock;
 for(const r of S.robots){const [rx,ry]=pos(r),u=X(rx),v=Y(ry);if(r.eyes){drawEyes(u,v,s,r.dir,'#fff');continue;}
  const scared=scaredT>0&&r.mode!=='leave'&&r.mode!=='home',blink=scared&&scaredT<1800&&Math.floor(now/180)%2;
  ctx.fillStyle=scared?(blink?'#f4f4f4':'#4a6fd1'):r.col;rr(u+s*0.12,v+s*0.16,s*0.76,s*0.72,s*0.2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=Math.max(1,s*0.06);ctx.beginPath();ctx.moveTo(u+s*0.5,v+s*0.16);ctx.lineTo(u+s*0.5,v+s*0.02);ctx.stroke();ctx.fillStyle='#f3c74a';ctx.beginPath();ctx.arc(u+s*0.5,v+s*0.03,s*0.06,0,7);ctx.fill();
  if(scared){ctx.fillStyle='#fff';ctx.fillRect(u+s*0.3,v+s*0.4,s*0.1,s*0.1);ctx.fillRect(u+s*0.6,v+s*0.4,s*0.1,s*0.1);ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,s*0.05);ctx.beginPath();for(let k=0;k<5;k++)ctx.lineTo(u+s*(0.28+k*0.11),v+s*(k%2?0.62:0.7));ctx.stroke();}
  else{drawEyes(u,v,s,r.dir,r.mode==='chase'?'#ffd0c8':'#fff',r.mode==='chase');}
  if(S.clock<S.freezeUntil){ctx.fillStyle='rgba(180,225,255,.55)';rr(u+s*0.08,v+s*0.1,s*0.84,s*0.82,s*0.2);ctx.fill();}}
 // ladybug
 const p=S.p;if(p){const hid=S.clock<S.hidden&&S.shed&&idx(p.x,p.y)===S.shed.i;const [px,py]=pos(p);
  if(!hid&&!(S.clock<(p.safeUntil||0)&&Math.floor(now/110)%2)){const cx=X(px)+s/2,cy=Y(py)+s/2;ctx.save();ctx.translate(cx,cy);ctx.rotate([0,Math.PI/2,Math.PI,-Math.PI/2][p.face]);
   const sk=SKINS[prog.skin].c,col=sk==='rainbow'?`hsl(${(now/8)%360},80%,55%)`:sk;const wig=p.moving?Math.sin(p.anim/60)*s*0.05:0;
   ctx.strokeStyle='#222';ctx.lineWidth=Math.max(1,s*0.05);for(const sd of [-1,1])for(const k of [-0.15,0.05,0.25]){ctx.beginPath();ctx.moveTo(sd*s*0.3,k*s);ctx.lineTo(sd*s*0.45,k*s+(sd>0?wig:-wig));ctx.stroke();}
   ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,s*0.05,s*0.36,s*0.4,0,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,-s*0.32,s*0.18,0,7);ctx.fill();
   ctx.strokeStyle='#222';ctx.beginPath();ctx.moveTo(0,-s*0.2);ctx.lineTo(0,s*0.44);ctx.stroke();for(const [a,b] of [[-0.17,-0.02],[0.17,-0.02],[-0.15,0.24],[0.15,0.24]]){ctx.beginPath();ctx.arc(a*s,b*s,s*0.07,0,7);ctx.fill();}
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*0.07,-s*0.38,s*0.04,0,7);ctx.arc(s*0.07,-s*0.38,s*0.04,0,7);ctx.fill();
   if(S.shield){ctx.strokeStyle='rgba(80,160,255,.8)';ctx.lineWidth=Math.max(2,s*0.08);ctx.beginPath();ctx.arc(0,0,s*0.56,0,7);ctx.stroke();}
   if(S.clock<S.bootsUntil){ctx.fillStyle='rgba(255,200,60,.35)';ctx.beginPath();ctx.arc(0,s*0.5,s*0.3,0,7);ctx.fill();}ctx.restore();}}
 // night garden
 if(L.params.dark&&p){const [px,py]=pos(p);const cx=X(px)+s/2,cy=Y(py)+s/2;const g=ctx.createRadialGradient(cx,cy,s*2.2,cx,cy,s*5.2);g.addColorStop(0,'rgba(10,20,30,0)');g.addColorStop(1,'rgba(10,20,30,.93)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawShed(X,Y,s,now);for(const i of S.flowers){const x=i%L.W,y=(i/L.W)|0;ctx.fillStyle='rgba(246,201,14,.7)';ctx.beginPath();ctx.arc(X(x)+s/2,Y(y)+s/2,s*0.18,0,7);ctx.fill();}
  for(const r of S.robots){if(r.eyes)continue;const [rx,ry]=pos(r);ctx.fillStyle='rgba(255,90,70,.9)';ctx.beginPath();ctx.arc(X(rx)+s*0.38,Y(ry)+s*0.48,s*0.06,0,7);ctx.arc(X(rx)+s*0.62,Y(ry)+s*0.48,s*0.06,0,7);ctx.fill();}}
 // popups
 for(const pp of S.popups){ctx.globalAlpha=1-pp.age/1100;ctx.fillStyle='#1f5540';ctx.font=`800 ${Math.round(s*0.7)}px system-ui`;ctx.textAlign='center';ctx.fillText(pp.text,X(pp.x)+s/2,Y(pp.y)-pp.age/40);ctx.globalAlpha=1;}
 // ready / hidden banners
 const banner=(t)=>{ctx.font=`800 ${Math.max(16,Math.round(s*1.1))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';const w=ctx.measureText(t).width+30;ctx.fillStyle='rgba(255,255,255,.92)';rr(W/2-w/2,H/2-s*0.9,w,s*1.8,12);ctx.fill();ctx.fillStyle='#1f5540';ctx.fillText(t,W/2,H/2);};
 if(S.state==='play'&&S.clock<S.readyUntil)banner(S.readyUntil-S.clock>500?T().ready:T().go);
 if(S.clock<S.hidden&&S.shed&&S.p&&idx(S.p.x,S.p.y)===S.shed.i){ctx.font=`700 ${Math.max(14,Math.round(s*0.8))}px system-ui`;ctx.textAlign='center';const t=fmt(T().hidden,{n:Math.ceil((S.hidden-S.clock)/1000)});const w=ctx.measureText(t).width+24;ctx.fillStyle='rgba(31,109,80,.92)';rr(W/2-w/2,8,w,34,10);ctx.fill();ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(t,W/2,25);}
 if(S.paused){ctx.fillStyle='rgba(15,45,35,.55)';ctx.fillRect(0,0,W,H);banner(T().pause);}}
function drawShed(X,Y,s,now){ if(S.shed){const x=S.shed.i%L.W,y=(S.shed.i/L.W)|0,u=X(x),v=Y(y);const glow=0.35+0.25*Math.sin(now/220);ctx.fillStyle=`rgba(255,240,150,${glow})`;ctx.beginPath();ctx.arc(u+s/2,v+s/2,s*0.9,0,7);ctx.fill();
  ctx.fillStyle='#b5562f';ctx.beginPath();ctx.moveTo(u+s*0.05,v+s*0.48);ctx.lineTo(u+s*0.5,v+s*0.08);ctx.lineTo(u+s*0.95,v+s*0.48);ctx.closePath();ctx.fill();ctx.fillStyle='#f1dfb4';ctx.fillRect(u+s*0.17,v+s*0.46,s*0.66,s*0.48);ctx.fillStyle='#6b4a2a';ctx.fillRect(u+s*0.4,v+s*0.62,s*0.2,s*0.32);
  if(S.clock<S.hidden){const left=(S.hidden-S.clock)/8000;ctx.strokeStyle='#1f6d50';ctx.lineWidth=Math.max(3,s*0.12);ctx.beginPath();ctx.arc(u+s/2,v+s/2,s*0.75,-Math.PI/2,-Math.PI/2+left*Math.PI*2);ctx.stroke();}}
}
function drawEyes(u,v,s,dir,white,angry){const [dx,dy]=DIRS[dir];ctx.fillStyle=white;ctx.beginPath();ctx.arc(u+s*0.36,v+s*0.46,s*0.11,0,7);ctx.arc(u+s*0.64,v+s*0.46,s*0.11,0,7);ctx.fill();
 ctx.fillStyle=angry?'#c0021b':'#1d2b3a';ctx.beginPath();ctx.arc(u+s*0.36+dx*s*0.04,v+s*0.46+dy*s*0.04,s*0.05,0,7);ctx.arc(u+s*0.64+dx*s*0.04,v+s*0.46+dy*s*0.04,s*0.05,0,7);ctx.fill();}
/* ---------- HUD, screens, dialogs ---------- */
function renderHud(){if(!S)return;const t=T();$('lvlTitle').textContent=S.kind==='daily'?'🌅 '+t.dailyT:fmt(t.level,{n:S.id});$('scoreBox').textContent=S.score.toLocaleString();
 $('lives').textContent='🐞'.repeat(Math.max(0,S.lives));$('seedsLeft').textContent='🌱 '+t.left+': '+(S.seeds.size+S.flowers.size);$('backBtn').textContent=t.back;$('pauseBtn').textContent=S.paused?'▶':'❚❚';
 const fx=[];if(S.clock<S.bootsUntil)fx.push('👟');if(S.clock<S.freezeUntil)fx.push('❄️');if(S.shield)fx.push('🛡️');if(S.clock<S.magnetUntil)fx.push('🧲');if(S.clock<S.scaredUntil)fx.push('🌻');$('effects').textContent=fx.join(' ');
 if(performance.now()>S.msgUntil&&S.msg){S.msg='';$('msg').textContent='';}}
function goalsText(){const t=T(),P=L.params;return [t.g1,t.g2,P.challenge==='robots'?fmt(t.gRobots,{n:P.eatGoal}):P.challenge==='fruit'?t.gFruit:fmt(t.gTime,{n:par()})];}
const FEATURE_AT=[['tunnel',4],['boots',6],['mud',10],['shed',12],['freeze',13],['oneway',16],['tele',20],['shield',25],['gates',30],['magnet',35],['dark',40]];
function showIntro(){const t=T(),P=L.params;S.state='intro';const g=goalsText();
 $('introTitle').textContent=S.kind==='daily'?'🌅 '+t.dailyT:fmt(t.level,{n:S.id});
 let news='';if(S.kind==='level'){const f=FEATURE_AT.find(([,lv])=>lv===S.id);if(f)news=`<p class="new"><b>${t.newThing}:</b> ${t.feat[f[0]]}</p>`;else if(P.dark)news=`<p class="new">${t.feat.dark}</p>`;else{const prev=M.params(S.id-1);if(S.id>1&&P.robots>prev.robots)news=`<p class="new">🤖 ${t.feat.more}</p>`;}}
 const best=S.kind==='level'?(prog.stars[S.id]||0):0;
 $('introBody').innerHTML=news+`<h3>${t.goals}</h3><ol class="goals">${g.map((x,k)=>`<li class="${k<best?'done':''}">${k<best?'★':'☆'} ${x}</li>`).join('')}</ol><p class="hint">${t.swipe}</p>`;
 $('introGo').textContent='▶ '+t.start;$('intro').hidden=false;}
function openDialog(kind){const t=T();if(kind==='lose'){$('loseTitle').textContent=t.lostAll;$('loseText').textContent=t.lostText;$('loseRetry').textContent='⟲ '+t.tryAgain;$('loseHome').textContent=t.home;$('lose').hidden=false;return;}
 const r=S.result,g=goalsText();$('winStars').innerHTML=[1,2,3].map(k=>`<span class="${k<=r.stars?'on':''}" style="animation-delay:${k*0.25}s">★</span>`).join('');
 $('winTitle').textContent=t.won;$('winScore').textContent=t.score+': '+S.score.toLocaleString()+(S.newBest?' — '+t.newBest:'');
 const got=[true,S.lost===0,r.goal3];$('winGoals').innerHTML=g.map((x,k)=>`<li class="${got[k]?'done':''}">${got[k]?'★':'☆'} ${x}</li>`).join('');
 $('winExtra').textContent=S.unlocked?'🐞 '+t.unlockSkin:(S.kind==='daily'?'🔥 '+fmt(t.streak,{n:prog.daily.streak}):'');
 $('winNext').hidden=!(S.kind==='level'&&S.id<COUNT);$('winNext').textContent=t.next;$('winHome').textContent=t.home;$('win').hidden=false;}
function show(w){$('home').hidden=w!=='home';$('game').hidden=w!=='game';document.body.classList.toggle('playing',w==='game');if(w==='home')renderHome();window.scrollTo(0,0);}
function renderHome(){const t=T();document.documentElement.lang=lang==='zh'?'zh-Hans':lang==='zt'?'zh-Hant':lang;document.title='MindGarden — '+t.title;
 $('title').textContent='🐞 '+t.title;$('subtitle').textContent=t.sub;$('langLabel').textContent='🌐 '+t.language;$('lang').value=lang;
 $('playBtn').textContent='▶ '+fmt(t.play,{n:prog.unlocked});
 const done=prog.daily.last===today();$('dailyTitle').textContent='🌅 '+t.daily;$('dailyBtn').textContent=done?t.dailyDone:'▶ '+t.dailyPlay;$('dailyBtn').disabled=done;
 const st=(prog.daily.last===today()||prog.daily.last===yesterday())?prog.daily.streak:0;$('streak').textContent=st?'🔥 '+fmt(t.streak,{n:st}):t.noStreak;
 const cleared=Object.keys(prog.stars).length,ts=totalStars();$('progTitle').textContent=fmt(t.progress,{n:cleared});$('progBar').style.width=cleared+'%';
 $('progStars').textContent=`★ ${ts} / 300 ${t.stars} · ${t.best}: ${Object.values(prog.best).reduce((a,b)=>a+b,0).toLocaleString()}`;
 $('replayLabel').textContent=t.replay;const opts=[`<option value="">${t.choose}</option>`];for(let i=1;i<=COUNT;i++)if(prog.stars[i])opts.push(`<option value="${i}">${fmt(t.level,{n:i})} ${'★'.repeat(prog.stars[i])}</option>`);$('replay').innerHTML=opts.join('');$('replayBox').hidden=!cleared;
 $('skinTitle').textContent=t.skins;$('skins').innerHTML=SKINS.map((k,i)=>{const lock=ts<k.need;const bg=k.c==='rainbow'?'conic-gradient(#e74c3c,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c)':k.c;
  return `<button type="button" class="skin${i===prog.skin?' on':''}" data-skin="${i}" ${lock?'disabled':''} aria-label="skin ${i+1}"><i style="background:${bg}"></i>${lock?fmt(t.skinLocked,{n:k.need}):''}</button>`;}).join('');
 $('howTitle').textContent=t.how;$('howText').textContent=t.howText;$('notice').textContent=t.notice;
 $('legend').innerHTML=t.legend.map(([k,label])=>`<div class="lg"><span class="ic">${{seed:'•',flower:'🌻',robot:'🤖',shed:'🏠',boots:'👟',freeze:'❄️',shield:'🛡️',magnet:'🧲'}[k]}</span><span>${label}</span></div>`).join('');}
/* ---------- loop ---------- */
let last=0;function loop(t){requestAnimationFrame(loop);if(!S||$('game').hidden){last=t;return;}const dt=Math.min(50,t-(last||t));last=t;if(S.state==='play'&&!S.paused&&!S.over)update(dt);draw(t);if(Math.floor(t/200)!==Math.floor((t-dt)/200))renderHud();}
requestAnimationFrame(loop);
/* ---------- input ---------- */
function want(d){if(!S||S.state!=='play')return;const p=S.p;if(d<0){p.want=-1;return;}p.want=d;
 if(p.moving&&d!==p.dir&&d!==(p.dir+2)%4&&p.t<0.38){const nx=step(p.x,p.y,p.dir,'player');
  // only when the corner ahead cannot take this turn: then the player meant the corner just passed
  if(step(p.x,p.y,d,'player')&&nx&&!L.tele.has(idx(nx[0],nx[1]))&&!step(nx[0],nx[1],d,'player')){p.t=0;p.moving=false;p.dir=d;p.face=d;return;}}
 if(p.moving&&d===(p.dir+2)%4&&d>=0){const [dx,dy]=DIRS[p.dir];p.x+=dx;p.y+=dy;if(p.x<0)p.x=L.W-1;if(p.x>=L.W)p.x=0;p.t=1-p.t;p.dir=d;p.face=d;}}
const KEYS={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
document.addEventListener('keydown',e=>{if(!S||$('game').hidden||e.target.tagName==='SELECT')return;if(e.key in KEYS){e.preventDefault();if(S.p)S.p.goal=-1;want(KEYS[e.key]);}else if(e.key===' '){e.preventDefault();togglePause();}});
const tileOf=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left-OX)/TS,(e.clientY-r.top-OY)/TS];};
let g=null;const SWIPE=14;
$('game').addEventListener('pointerdown',e=>{if(e.target.closest('button,a,select,.modal,#intro,#win,#lose'))return;if(e.pointerType==='touch')TOUCH=true;
 g={id:e.pointerId,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,swiped:false,onMaze:e.target===cv};if(e.target===cv)e.preventDefault();try{e.target.setPointerCapture(e.pointerId);}catch(_){}});
$('game').addEventListener('pointermove',e=>{if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.max(Math.abs(dx),Math.abs(dy))<SWIPE)return;
 if(S&&S.p)S.p.goal=-1;want(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));g.swiped=true;g.x=e.clientX;g.y=e.clientY;});
const endG=e=>{if(!g||g.id!==e.pointerId)return;const tap=!g.swiped&&Math.hypot(e.clientX-g.x0,e.clientY-g.y0)<SWIPE&&g.onMaze;g=null;if(tap&&e.type==='pointerup'){const [fx,fy]=tileOf(e);setGoalAt(fx,fy);}};
$('game').addEventListener('pointerup',endG);$('game').addEventListener('pointercancel',endG);
for(const [id,d] of [['bUp',0],['bRight',1],['bDown',2],['bLeft',3]])$(id).addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType==='touch')TOUCH=true;if(S&&S.p)S.p.goal=-1;want(d);});
function togglePause(){if(!S||S.over||S.state!=='play')return;S.paused=!S.paused;renderHud();}
$('pauseBtn').addEventListener('click',togglePause);
$('backBtn').addEventListener('click',()=>{S=null;L=null;closeAll();show('home');});
$('introGo').addEventListener('click',()=>{$('intro').hidden=true;S.state='play';S.readyUntil=S.clock+1600;});
function closeAll(){for(const id of ['intro','win','lose'])$(id).hidden=true;}
$('winNext').addEventListener('click',()=>{closeAll();startLevel('level',S.id+1);});
$('winHome').addEventListener('click',()=>{closeAll();S=null;show('home');});
$('loseRetry').addEventListener('click',()=>{closeAll();startLevel(S.kind,S.id);});
$('loseHome').addEventListener('click',()=>{closeAll();S=null;show('home');});
$('playBtn').addEventListener('click',()=>startLevel('level',prog.unlocked));
$('dailyBtn').addEventListener('click',()=>startLevel('daily',today()));
$('replay').addEventListener('change',e=>{if(e.target.value)startLevel('level',+e.target.value);});
$('skins').addEventListener('click',e=>{const b=e.target.closest('[data-skin]');if(!b||b.disabled)return;prog.skin=+b.dataset.skin;save();renderHome();});
$('lang').addEventListener('change',e=>{lang=e.target.value;writeLang(lang);renderHome();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.state==='play'&&!S.over){S.paused=true;renderHud();}});
load();show('home');
window.MG_SEED={get S(){return S},get touch(){return TOUCH},get L(){return L},startLevel,update:(n,dt)=>{for(let i=0;i<n&&S&&!S.over;i++)update(dt||16);},want,distField:(x,y,w)=>distField(x,y,w||'player'),step:(x,y,d)=>step(x,y,d,'player'),prog:()=>prog,go:()=>{$('intro').hidden=true;S.state='play';S.readyUntil=S.clock;}};
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
