<script>
/* MindGarden Mahjong Solitaire core — boards, generation (always solvable), solver, hints. Offline. */
'use strict';
var MJ=(function(){
const COLS=6;
/* Stack heights per cell (6 columns). Upper tiles sit exactly on top of lower ones. */
const LAYOUTS={
 small:['011110','112211','121121','121121','112211','011110'],
 medium:['111111','122221','123321','123321','122221','111111'],
 large:['011110','122221','123321','224422','123321','122221','011110'],
 expert:['111111','123321','234432','125521','234432','123321','010010']};
/* Tile faces: 0-8 characters 1-9, 9-17 dots 1-9, 18-26 bamboo 1-9, 27-30 winds E S W N,
   31-33 dragons red/green/white, 34-37 flowers, 38-41 seasons */
const NFACES=42;
const suitOf=f=>f<9?'char':f<18?'dot':f<27?'bam':f<31?'wind':f<34?'dragon':f<38?'flower':'season';
function layout(size){const rows=LAYOUTS[size]||LAYOUTS.small;const H=[];for(const r of rows)for(const ch of r)H.push(+ch);return {rows:rows.length,H};}
function isFree(H,cell){const h=H[cell];if(!h)return false;const c=cell%COLS;const l=c>0?H[cell-1]:0,r=c<COLS-1?H[cell+1]:0;return l<h||r<h;}
function freeCells(H){const out=[];for(let i=0;i<H.length;i++)if(isFree(H,i))out.push(i);return out;}
const top=(H,F,cell)=>F[cell][H[cell]-1];
function matches(H,F){const fr=freeCells(H),by=new Map(),out=[];for(const c of fr){const f=top(H,F,c);if(!by.has(f))by.set(f,[]);by.get(f).push(c);}
 for(const list of by.values())for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)out.push([list[i],list[j]]);return out;}
const total=H=>H.reduce((a,b)=>a+b,0);
function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Simulate a legal clearing order on heights H; returns list of pairs [[cell,z],[cell,z]] or null. */
function removalOrder(H0,rnd,spread){
 for(let attempt=0;attempt<60;attempt++){const H=H0.slice(),pairs=[];let ok=true,step=0;const since=new Map();for(const c of freeCells(H))since.set(c,0);
  while(total(H)){const fr=freeCells(H);if(fr.length<2){ok=false;break;}step++;for(const c of fr)if(!since.has(c))since.set(c,step);
   // Pair a recently-freed tile with another tile, so few pairs are matchable at the start:
   // the player has to uncover tiles to find partners (like a real layout).
   const w=c=>Math.pow(1+since.get(c),spread)*(H[c]);
   const pickW=list=>{let sum=0;for(const c of list)sum+=w(c);let x=rnd()*sum;for(const c of list){x-=w(c);if(x<=0)return c;}return list[list.length-1];};
   const a=pickW(fr);const others=fr.filter(c=>c!==a);const b=pickW(others);
   pairs.push([[a,H[a]-1],[b,H[b]-1]]);H[a]--;H[b]--;for(const c of [a,b])if(H[c])since.set(c,step);else since.delete(c);}
  if(ok)return pairs;}
 return null;}
/* Build faces F (per cell, bottom→top) for heights H0. facePairs: optional list of faces (one per pair) to reuse. */
function assign(H0,rnd,facePairs,spread){const order=removalOrder(H0,rnd,spread==null?2:spread);if(!order)return null;
 let faces;if(facePairs){faces=shuffle(facePairs.slice(),rnd);}
 else{const n=order.length,kinds=shuffle([...Array(NFACES).keys()],rnd);const distinct=Math.min(NFACES,Math.ceil(n*0.8));faces=kinds.slice(0,distinct);
  const extra=shuffle(faces.slice(),rnd);let k=0;while(faces.length<n)faces.push(extra[k++%extra.length]);faces=shuffle(faces,rnd);}
 const F=H0.map(h=>new Array(h).fill(-1));order.forEach((pr,i)=>{for(const [c,z] of pr)F[c][z]=faces[i];});return F;}
/* Solver: depth-first search on stack heights, with memo and safe-move shortcuts. Returns true, false or null (gave up). */
function solvable(H0,F,limit){limit=limit||60000;const H=H0.slice();const remain=new Map();
 for(let c=0;c<H.length;c++)for(let z=0;z<H[c];z++){const f=F[c][z];remain.set(f,(remain.get(f)||0)+1);}
 const dead=new Set();let nodes=0,left=total(H);
 function rec(){if(!left)return true;const key=H.join('');if(dead.has(key))return false;if(++nodes>limit)throw 0;
  const fr=freeCells(H),by=new Map();for(const c of fr){const f=top(H,F,c);if(!by.has(f))by.set(f,[]);by.get(f).push(c);}
  // safe moves: every remaining copy of a face is free right now
  for(const [f,list] of by){const n=remain.get(f);if(list.length===n&&n>=2){for(const c of list)H[c]--;left-=n;remain.set(f,0);const r=rec();for(const c of list)H[c]++;left+=n;remain.set(f,n);if(r)return true;dead.add(key);return false;}}
  for(const [f,list] of by){if(list.length<2)continue;for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];
   H[a]--;H[b]--;left-=2;remain.set(f,remain.get(f)-2);const r=rec();H[a]++;H[b]++;left+=2;remain.set(f,remain.get(f)+2);if(r)return true;}}
  dead.add(key);return false;}
 try{return rec();}catch(e){return null;}}
/* Make a new board of the given size. Picks a layout with a comfortable number of opening matches. */
function newBoard(size,rnd){rnd=rnd||Math.random;const {rows,H}=layout(size);const target={small:[3,5],medium:[3,4],large:[2,4],expert:[2,4]}[size]||[3,4];
 let best=null,bestScore=-1e9;for(let t=0;t<30;t++){const F=assign(H,rnd,null,1+t%4);if(!F)continue;const m=matches(H,F).length;const score=-(m<target[0]?(target[0]-m)*3:m>target[1]?m-target[1]:0);
  if(score>bestScore){best=F;bestScore=score;}if(score===0)break;}
 return {rows,H,F:best};}
/* Re-deal the faces of the remaining tiles so the position is solvable again. */
function rearrange(H,F,rnd){rnd=rnd||Math.random;const cnt=new Map();for(let c=0;c<H.length;c++)for(let z=0;z<H[c];z++){const f=F[c][z];cnt.set(f,(cnt.get(f)||0)+1);}
 const fp=[];for(const [f,n] of cnt)for(let k=0;k<n/2;k++)fp.push(f);
 const NF=assign(H,rnd,fp);if(!NF)return null;return H.map((h,c)=>{const col=F[c].slice();for(let z=0;z<h;z++)col[z]=NF[c][z];return col;});}
/* Smart hint: a pair that keeps the board clearable. If none exists, how many pairs to undo. */
function hint(H,F,history){const ms=matches(H,F);
 if(ms.length){const scored=[];for(const [a,b] of ms){H[a]--;H[b]--;const s=solvable(H,F,25000);H[a]++;H[b]++;if(s===true)return {pair:[a,b],safe:true};scored.push([s,a,b]);}
  const unknown=scored.find(x=>x[0]===null);if(unknown)return {pair:[unknown[1],unknown[2]],safe:null};}
 // dead end: find the smallest number of undos that gets back to a clearable position
 const Hx=H.slice();for(let k=1;k<=history.length;k++){const [a,b]=history[history.length-k];Hx[a]++;Hx[b]++;if(solvable(Hx,F,25000)!==false)return {deadEnd:true,undo:k,noMoves:!ms.length};}
 return {deadEnd:true,undo:0,noMoves:!ms.length};}
return {COLS,LAYOUTS,NFACES,suitOf,layout,isFree,freeCells,matches,solvable,newBoard,rearrange,hint,total};
})();
if(typeof module!=='undefined')module.exports=MJ;
</script>
<script>
/* MindGarden Mahjong tile faces, drawn as SVG (no fonts or images needed for the patterns). viewBox 0 0 60 80 */
'use strict';
var MJTiles=(function(){
const NUM='一二三四五六七八九';
const BLUE='#1d4f91',GREEN='#1b7148',RED='#c0352b';
const DOTS=[[[30,40,17]],[[30,22,11],[30,58,11]],[[15,17,9],[30,40,9],[45,63,9]],[[18,24,10],[42,24,10],[18,56,10],[42,56,10]],
 [[17,20,9],[43,20,9],[30,40,9],[17,60,9],[43,60,9]],[[18,17,9],[42,17,9],[18,40,9],[42,40,9],[18,63,9],[42,63,9]],
 [[13,12,6.5],[30,21,6.5],[47,30,6.5],[19,50,7.5],[41,50,7.5],[19,68,7.5],[41,68,7.5]],
 [[18,13,7.5],[42,13,7.5],[18,31,7.5],[42,31,7.5],[18,49,7.5],[42,49,7.5],[18,67,7.5],[42,67,7.5]],
 [[13,18,7.5],[30,18,7.5],[47,18,7.5],[13,40,7.5],[30,40,7.5],[47,40,7.5],[13,62,7.5],[30,62,7.5],[47,62,7.5]]];
const DOTCOL=[[RED],[GREEN,BLUE],[BLUE,RED,GREEN],[BLUE,GREEN,GREEN,BLUE],[BLUE,GREEN,RED,GREEN,BLUE],[GREEN,GREEN,RED,RED,RED,RED],
 [GREEN,GREEN,GREEN,RED,RED,RED,RED],[BLUE,BLUE,BLUE,BLUE,BLUE,BLUE,BLUE,BLUE],[BLUE,BLUE,BLUE,RED,RED,RED,GREEN,GREEN,GREEN]];
const dot=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${c}" stroke-width="${r*0.42}"/><circle cx="${x}" cy="${y}" r="${r*0.38}" fill="${c}"/>`;
const stick=(x,y,c,h)=>{h=h||20;return `<rect x="${x-3.6}" y="${y-h/2}" width="7.2" height="${h}" rx="3.4" fill="${c}"/><rect x="${x-4.4}" y="${y-1.4}" width="8.8" height="2.8" rx="1.4" fill="${c}" opacity=".9"/><line x1="${x}" y1="${y-h/2+3}" x2="${x}" y2="${y+h/2-3}" stroke="#fff" stroke-width="1.2" opacity=".55"/>`;};
const BAM=[null,[[30,22],[30,58]],[[30,22],[18,58],[42,58]],[[18,22],[42,22],[18,58],[42,58]],[[16,22],[44,22],[30,40,RED],[16,58],[44,58]],
 [[14,22],[30,22],[46,22],[14,58],[30,58],[46,58]],[[30,15,RED],[14,40],[30,40],[46,40],[14,64],[30,64],[46,64]],
 [[12,22],[24,22],[36,22],[48,22],[12,58],[24,58],[36,58],[48,58]],
 [[14,16,RED],[30,16,BLUE],[46,16,GREEN],[14,40,RED],[30,40,BLUE],[46,40,GREEN],[14,64,RED],[30,64,BLUE],[46,64,GREEN]]];
function bamboo(n){if(n===1){return `<path d="M30 12c9 6 12 16 6 24 8 2 12 10 9 20-6-5-11-6-15-4 1 6-1 11-6 15-1-7-4-11-9-13 6-5 8-11 7-18-6 1-10-2-12-7 7 0 12-3 15-8-3-3-3-6 0-9z" fill="${GREEN}"/><circle cx="33" cy="20" r="2.4" fill="${RED}"/><path d="M24 64l-5 6M30 64v8M36 63l5 6" stroke="${RED}" stroke-width="2.4" stroke-linecap="round"/>`;}
 return BAM[n-1].map(([x,y,c])=>stick(x,y,c||GREEN,n>=7?19:22)).join('');}
const txt=(s,y,size,c,w)=>`<text x="30" y="${y}" font-size="${size}" fill="${c}" font-weight="${w||800}" text-anchor="middle" dominant-baseline="central" font-family="'Songti SC','STKaiti','KaiTi','Noto Serif CJK SC','Noto Serif CJK TC','PMingLiU',serif">${s}</text>`;
const FLOWERS=['梅','蘭','菊','竹'],FLC=['#c2185b','#7b3fa0','#c77c02',GREEN],SEASONS=['春','夏','秋','冬'],SEC=[GREEN,RED,'#c77c02',BLUE];
const cache=new Map();
function svg(f){if(cache.has(f))return cache.get(f);let body='';
 if(f<9)body=txt(NUM[f],22,27,'#1f2a44')+txt('萬',57,30,RED);
 else if(f<18)body=DOTS[f-9].map(([x,y,r],i)=>dot(x,y,r,DOTCOL[f-9][i])).join('');
 else if(f<27)body=bamboo(f-17);
 else if(f<31)body=txt('東南西北'[f-27],40,40,'#1f2a44');
 else if(f===31)body=txt('中',40,42,RED);
 else if(f===32)body=txt('發',40,40,GREEN);
 else if(f===33)body=`<rect x="12" y="14" width="36" height="52" rx="4" fill="none" stroke="${BLUE}" stroke-width="4"/><rect x="18" y="20" width="24" height="40" rx="2" fill="none" stroke="${BLUE}" stroke-width="1.6"/>`;
 else if(f<38)body=txt(FLOWERS[f-34],44,34,FLC[f-34])+`<text x="8" y="14" font-size="11" fill="${FLC[f-34]}" font-weight="700">${f-33}</text>`+`<circle cx="44" cy="14" r="4" fill="${FLC[f-34]}" opacity=".85"/><circle cx="50" cy="19" r="2.6" fill="${FLC[f-34]}" opacity=".6"/>`;
 else body=txt(SEASONS[f-38],44,34,SEC[f-38])+`<text x="8" y="14" font-size="11" fill="${SEC[f-38]}" font-weight="700">${f-37}</text>`;
 const s=`<svg viewBox="0 0 60 80" aria-hidden="true" focusable="false">${body}</svg>`;cache.set(f,s);return s;}
/* Spoken names for screen readers / hint text */
const NAMES={
 en:{char:'Characters',dot:'Dots',bam:'Bamboo',wind:['East wind','South wind','West wind','North wind'],dragon:['Red dragon','Green dragon','White dragon'],flower:['Plum','Orchid','Chrysanthemum','Bamboo flower'],season:['Spring','Summer','Autumn','Winter']},
 ms:{char:'Aksara',dot:'Bulat',bam:'Buluh',wind:['Angin Timur','Angin Selatan','Angin Barat','Angin Utara'],dragon:['Naga Merah','Naga Hijau','Naga Putih'],flower:['Plum','Orkid','Kekwa','Bunga Buluh'],season:['Musim Bunga','Musim Panas','Musim Luruh','Musim Sejuk']},
 zh:{char:'万',dot:'筒',bam:'条',wind:['东风','南风','西风','北风'],dragon:['红中','发财','白板'],flower:['梅','兰','菊','竹'],season:['春','夏','秋','冬']},
 zt:{char:'萬',dot:'筒',bam:'條',wind:['東風','南風','西風','北風'],dragon:['紅中','發財','白板'],flower:['梅','蘭','菊','竹'],season:['春','夏','秋','冬']}};
function name(f,lang){const N=NAMES[lang]||NAMES.en,cn=lang==='zh'||lang==='zt';
 if(f<27){const n=f%9+1,s=f<9?N.char:f<18?N.dot:N.bam;return cn?NUM[n-1]+s:n+' '+s;}
 if(f<31)return N.wind[f-27];if(f<34)return N.dragon[f-31];if(f<38)return N.flower[f-34];return N.season[f-38];}
return {svg,name};
})();
if(typeof module!=='undefined')module.exports=MJTiles;
</script>
<script>
/* MindGarden Mahjong Solitaire — page interface */
'use strict';
(function(){
const TXT={
en:{title:'Mahjong Garden',sub:'Match pairs of identical tiles. No timer, no penalties.',language:'Language',size:'Board',
 sizes:{small:'Small · 40 tiles',medium:'Medium · 56 tiles',large:'Large · 68 tiles',expert:'Expert · 84 tiles'},
 pairsLeft:'Pairs left',available:'Matches you can make',hint:'Hint',undo:'Undo',rearrange:'Rearrange',restart:'Restart',newBoard:'New board',
 start:'Tap two matching tiles that are free (bright). A tile is free when nothing is on top of it and its left or right side is open.',
 pick:'Now tap the matching tile.',match:'Lovely match! 🌿',notMatch:'Those two are different — try another tile.',blocked:'That tile is blocked. Free its left or right side, or clear the tiles on top first.',
 won:'Garden cleared! Well played 🌸',wonSolo:'Garden cleared without any help — wonderful! 🌸',hintMsg:'Try these two: {name}.',
 deadEnd:'Heads-up: from here the board can no longer be fully cleared. Tap Undo {n}× to get back on track, or tap Rearrange.',deadEndRe:'This board can no longer be fully cleared. Tap Rearrange to shuffle the remaining tiles.',
 stuck:'No more matches. Tap Undo or Rearrange — you can still finish!',rearranged:'Tiles shuffled into a layout that can be cleared.',restarted:'Back to the start of this board.',undone:'Last pair put back.',
 confirmSize:'Start a new board? The current one will be cleared.',yes:'Yes, new board',no:'Keep playing',restored:'Welcome back — your board was restored.',
 how:'How to play',howText:'Find two identical tiles and tap them one after the other to remove them. Only free tiles can be used: bright tiles are free, greyed tiles are blocked. A tile is free when no tile is stacked on it and it has an open left or right side. The small number shows how many tiles are stacked in that spot. Plan ahead — taking the wrong pair can block tiles you need later. Hints always show a pair that still lets you clear the whole board.',
 garden:'My garden',cleared:'Boards cleared',solo:'without help',earlier:'from the earlier version',
 notice:'No ads, no timers, no sound. Your board is saved on this device. For recreation, not medical treatment.'},
ms:{title:'Taman Mahjong',sub:'Padankan pasangan jubin yang sama. Tiada pemasa, tiada penalti.',language:'Bahasa',size:'Papan',
 sizes:{small:'Kecil · 40 jubin',medium:'Sederhana · 56 jubin',large:'Besar · 68 jubin',expert:'Pakar · 84 jubin'},
 pairsLeft:'Baki pasangan',available:'Padanan boleh dibuat',hint:'Petunjuk',undo:'Undur',rearrange:'Susun semula',restart:'Mula semula',newBoard:'Papan baharu',
 start:'Ketik dua jubin sama yang bebas (cerah). Jubin bebas jika tiada jubin di atasnya dan sisi kiri atau kanannya terbuka.',
 pick:'Sekarang ketik jubin yang sepadan.',match:'Padanan yang bagus! 🌿',notMatch:'Dua jubin itu berbeza — cuba jubin lain.',blocked:'Jubin itu terhalang. Buka sisi kiri atau kanannya, atau alihkan jubin di atasnya dahulu.',
 won:'Taman berjaya dikosongkan! Syabas 🌸',wonSolo:'Dikosongkan tanpa sebarang bantuan — hebat! 🌸',hintMsg:'Cuba dua ini: {name}.',
 deadEnd:'Perhatian: dari sini papan tidak lagi boleh dikosongkan sepenuhnya. Ketik Undur {n}× untuk kembali ke laluan betul, atau ketik Susun semula.',deadEndRe:'Papan ini tidak lagi boleh dikosongkan sepenuhnya. Ketik Susun semula untuk mengocok jubin yang tinggal.',
 stuck:'Tiada padanan lagi. Ketik Undur atau Susun semula — anda masih boleh selesaikan!',rearranged:'Jubin dikocok menjadi susunan yang boleh diselesaikan.',restarted:'Kembali ke permulaan papan ini.',undone:'Pasangan terakhir dikembalikan.',
 confirmSize:'Mulakan papan baharu? Papan sekarang akan dipadam.',yes:'Ya, papan baharu',no:'Teruskan bermain',restored:'Selamat kembali — papan anda telah dipulihkan.',
 how:'Cara bermain',howText:'Cari dua jubin yang sama dan ketik satu demi satu untuk mengalihkannya. Hanya jubin bebas boleh digunakan: jubin cerah adalah bebas, jubin kelabu terhalang. Jubin bebas jika tiada jubin bertindih di atasnya dan sisi kiri atau kanannya terbuka. Nombor kecil menunjukkan bilangan jubin bertindih di tempat itu. Rancang dahulu — pasangan yang salah boleh menghalang jubin yang diperlukan kemudian. Petunjuk sentiasa menunjukkan pasangan yang masih membolehkan papan dikosongkan.',
 garden:'Taman saya',cleared:'Papan diselesaikan',solo:'tanpa bantuan',earlier:'dari versi terdahulu',
 notice:'Tiada iklan, tiada pemasa, tiada bunyi. Papan disimpan dalam peranti ini. Untuk rekreasi, bukan rawatan perubatan.'},
zh:{title:'麻将花园',sub:'找出相同的牌两两配对。无计时，无惩罚。',language:'语言',size:'牌局',
 sizes:{small:'小 · 40张',medium:'中 · 56张',large:'大 · 68张',expert:'高手 · 84张'},
 pairsLeft:'剩余对数',available:'可配对',hint:'提示',undo:'撤销',rearrange:'重新洗牌',restart:'重来',newBoard:'新牌局',
 start:'点两张相同且可用（明亮）的牌。牌上方没有牌、且左边或右边是空的，就可以用。',
 pick:'再点一张相同的牌。',match:'配对成功！🌿',notMatch:'这两张不一样，换一张试试。',blocked:'这张牌被挡住了。先让它左边或右边空出来，或先拿走上面的牌。',
 won:'全部清空！下得好 🌸',wonSolo:'不靠任何帮助就清空了，太棒了！🌸',hintMsg:'试试这两张：{name}。',
 deadEnd:'提醒：照现在的局面已无法全部清空。点“撤销”{n}次回到正确路线，或点“重新洗牌”。',deadEndRe:'这一局已无法全部清空。点“重新洗牌”把剩下的牌重新排列。',
 stuck:'没有可配对的牌了。点“撤销”或“重新洗牌”，你还是能完成的！',rearranged:'已重新洗牌，这个排列可以全部清空。',restarted:'已回到这一局的开头。',undone:'已放回上一对牌。',
 confirmSize:'开始新牌局？当前牌局将被清除。',yes:'是，开新局',no:'继续玩',restored:'欢迎回来，你的牌局已恢复。',
 how:'玩法说明',howText:'找出两张相同的牌，先后点一下就能拿走。只有可用的牌才能点：明亮的牌可用，灰色的牌被挡住。牌上方没有叠牌、且左边或右边是空的，就是可用的牌。小数字表示这个位置叠了几张牌。要先想好——拿错一对，可能会挡住以后需要的牌。“提示”给出的配对，一定还能让整局清空。',
 garden:'我的花园',cleared:'已清空牌局',solo:'独立完成',earlier:'来自旧版本',
 notice:'无广告、无计时、无声音。牌局保存在本设备。仅供休闲，不作医疗用途。'},
zt:{title:'麻將花園',sub:'找出相同的牌兩兩配對。無計時，無懲罰。',language:'語言',size:'牌局',
 sizes:{small:'小 · 40張',medium:'中 · 56張',large:'大 · 68張',expert:'高手 · 84張'},
 pairsLeft:'剩餘對數',available:'可配對',hint:'提示',undo:'撤銷',rearrange:'重新洗牌',restart:'重來',newBoard:'新牌局',
 start:'點兩張相同且可用（明亮）的牌。牌上方沒有牌、且左邊或右邊是空的，就可以用。',
 pick:'再點一張相同的牌。',match:'配對成功！🌿',notMatch:'這兩張不一樣，換一張試試。',blocked:'這張牌被擋住了。先讓它左邊或右邊空出來，或先拿走上面的牌。',
 won:'全部清空！下得好 🌸',wonSolo:'不靠任何幫助就清空了，太棒了！🌸',hintMsg:'試試這兩張：{name}。',
 deadEnd:'提醒：照現在的局面已無法全部清空。點「撤銷」{n}次回到正確路線，或點「重新洗牌」。',deadEndRe:'這一局已無法全部清空。點「重新洗牌」把剩下的牌重新排列。',
 stuck:'沒有可配對的牌了。點「撤銷」或「重新洗牌」，你還是能完成的！',rearranged:'已重新洗牌，這個排列可以全部清空。',restarted:'已回到這一局的開頭。',undone:'已放回上一對牌。',
 confirmSize:'開始新牌局？目前牌局將被清除。',yes:'是，開新局',no:'繼續玩',restored:'歡迎回來，你的牌局已恢復。',
 how:'玩法說明',howText:'找出兩張相同的牌，先後點一下就能拿走。只有可用的牌才能點：明亮的牌可用，灰色的牌被擋住。牌上方沒有疊牌、且左邊或右邊是空的，就是可用的牌。小數字表示這個位置疊了幾張牌。要先想好——拿錯一對，可能會擋住以後需要的牌。「提示」給出的配對，一定還能讓整局清空。',
 garden:'我的花園',cleared:'已清空牌局',solo:'獨立完成',earlier:'來自舊版本',
 notice:'無廣告、無計時、無聲音。牌局儲存在本裝置。僅供休閒，不作醫療用途。'}};
const $=id=>document.getElementById(id),SIZES=['small','medium','large','expert'],KEY='mindgarden-mahjong-v2';
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
function readLang(){let l=null;try{l=new URLSearchParams(location.search).get('lang');}catch(e){}
 if(!TXT[l]){try{l=localStorage.getItem('mindgarden-lang');}catch(e){}}
 if(!TXT[l]){try{const s=JSON.parse(localStorage.getItem('mindgarden-settings')||'null');l=s&&s.lang;}catch(e){}}return TXT[l]?l:'en';}
function writeLang(l){try{localStorage.setItem('mindgarden-lang',l);const s=JSON.parse(localStorage.getItem('mindgarden-settings')||'{}')||{};s.lang=l;localStorage.setItem('mindgarden-settings',JSON.stringify(s));}catch(e){}}
let lang=readLang();const T=()=>TXT[lang];
let size='small',rows=6,startH=[],F=[],H=[],history=[],selected=-1,hinted=[],message='',warn='',helpUsed=false,busy=false,confirming=null,pendingSize=null;
let stats={cleared:{},solo:{},earlier:0};
/* ---------- persistence ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify({schema:1,size,rows,startH,F,history,helpUsed,stats}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
 if(d&&d.schema===1){if(d.stats&&typeof d.stats==='object')stats={cleared:Object.assign({},d.stats.cleared),solo:Object.assign({},d.stats.solo),earlier:+d.stats.earlier||0};
  if(SIZES.includes(d.size)&&Array.isArray(d.startH)&&Array.isArray(d.F)&&Array.isArray(d.history)){const L=MJ.layout(d.size);
   if(d.startH.length===L.H.length&&d.F.length===L.H.length&&d.startH.every((h,i)=>Number.isInteger(h)&&h>=0&&h<=L.H[i]&&Array.isArray(d.F[i])&&d.F[i].length===L.H[i]&&d.F[i].every(f=>Number.isInteger(f)&&f>=0&&f<MJ.NFACES))){
    size=d.size;rows=L.rows;startH=d.startH.slice();F=d.F.map(c=>c.slice());H=startH.slice();history=[];
    for(const p of d.history){if(!Array.isArray(p)||p.length!==2)break;const [a,b]=p;if(!MJ.isFree(H,a)||!MJ.isFree(H,b)||a===b||F[a][H[a]-1]!==F[b][H[b]-1])break;H[a]--;H[b]--;history.push([a,b]);}
    helpUsed=!!d.helpUsed;return true;}}}
 else{const old=JSON.parse(localStorage.getItem('mindgarden-mahjong-v1')||'null');if(old&&old.completedRecords&&typeof old.completedRecords==='object')stats.earlier=Math.min(100000,Object.keys(old.completedRecords).length);}
 }catch(e){}return false;}
/* ---------- game ---------- */
function newBoard(sz){size=sz||size;const b=MJ.newBoard(size);rows=b.rows;startH=b.H.slice();F=b.F;H=startH.slice();history=[];selected=-1;hinted=[];warn='';helpUsed=false;message=T().start;save();buildBoard();render();}
const left=()=>MJ.total(H)/2;
function checkState(){warn='';if(!MJ.total(H))return;const ms=MJ.matches(H,F);
 if(!ms.length){warn=T().stuck;return;}
 if(MJ.solvable(H,F,30000)===false){const h=MJ.hint(H,F,history);warn=h.undo?fmt(T().deadEnd,{n:h.undo}):T().deadEndRe;}}
function finish(){const won=!MJ.total(H);if(won){stats.cleared[size]=(stats.cleared[size]||0)+1;if(!helpUsed)stats.solo[size]=(stats.solo[size]||0)+1;message=helpUsed?T().won:T().wonSolo;}
 save();render();if(won)$('board').classList.add('cleared');}
function tap(cell){if(busy||confirming)return;if(!H[cell])return;
 if(!MJ.isFree(H,cell)){message=T().blocked;shake(cell);render();return;}
 if(selected===-1){selected=cell;message=T().pick;hinted=hinted.includes(cell)?hinted:[];render();return;}
 if(selected===cell){selected=-1;message='';render();return;}
 const fa=F[selected][H[selected]-1],fb=F[cell][H[cell]-1];
 if(fa!==fb){message=T().notMatch;shake(cell);selected=cell;render();return;}
 const a=selected,b=cell;busy=true;selected=-1;hinted=[];
 for(const c of [a,b])tiles[c]&&tiles[c].classList.add('vanish');
 setTimeout(()=>{H[a]--;H[b]--;history.push([a,b]);message=T().match;busy=false;checkState();finish();},230);}
function shake(cell){const el=tiles[cell];if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function undo(){if(!history.length||busy)return;const [a,b]=history.pop();H[a]++;H[b]++;helpUsed=true;selected=-1;hinted=[];message=T().undone;$('board').classList.remove('cleared');checkState();save();render();}
function restart(){if(busy)return;H=startH.slice();history=[];helpUsed=true;selected=-1;hinted=[];warn='';message=T().restarted;$('board').classList.remove('cleared');save();render();}
function rearrange(){if(busy||!MJ.total(H))return;const NF=MJ.rearrange(H,F);if(!NF)return;F=NF;startH=H.slice();history=[];helpUsed=true;selected=-1;hinted=[];warn='';message=T().rearranged;save();render();}
function hint(){if(busy||!MJ.total(H))return;helpUsed=true;const h=MJ.hint(H,F,history);
 if(h.pair){hinted=h.pair;selected=-1;message=fmt(T().hintMsg,{name:MJTiles.name(F[h.pair[0]][H[h.pair[0]]-1],lang)});warn='';}
 else{hinted=[];warn=h.undo?fmt(T().deadEnd,{n:h.undo}):T().deadEndRe;}save();render();}
/* ---------- rendering ---------- */
let tiles=[];
function buildBoard(){const root=$('board');root.innerHTML='';root.style.gridTemplateRows=`repeat(${rows},auto)`;root.classList.remove('cleared');tiles=[];
 for(let i=0;i<rows*MJ.COLS;i++){const slot=document.createElement('div');slot.className='slot';const b=document.createElement('button');b.type='button';b.className='tile';
  b.addEventListener('click',()=>tap(i));slot.appendChild(b);root.appendChild(slot);tiles.push(b);}}
function stackShadow(h){const L=[];for(let k=1;k<h;k++)L.push(`${k*2.5}px ${k*3.5}px 0 ${k%2?'#d6c49a':'#c4ae7c'}`);L.push(`${h*2.5+1}px ${h*3.5+2}px 5px #5a4a2a55`);return L.join(',');}
function render(){const t=T();
 document.documentElement.lang=lang==='zh'?'zh-Hans':lang==='zt'?'zh-Hant':lang;document.title='MindGarden — '+t.title;
 $('title').textContent='🀄 '+t.title;$('subtitle').textContent=t.sub;$('langLabel').textContent='🌐 '+t.language;$('lang').value=lang;$('sizeLabel').textContent=t.size;
 $('size').innerHTML=SIZES.map(s=>`<option value="${s}">${t.sizes[s]}</option>`).join('');$('size').value=size;
 const ms=MJ.total(H)?MJ.matches(H,F):[];
 $('pairs').innerHTML=`${t.pairsLeft}: <b>${left()}</b>`;$('avail').innerHTML=`${t.available}: <b>${ms.length}</b>`;
 const won=!MJ.total(H);$('msg').textContent=message||t.start;$('msg').className='msg'+(won?' win':'');$('warn').textContent=warn;$('warn').hidden=!warn||won;
 $('hintBtn').textContent='💡 '+t.hint;$('undoBtn').textContent='↶ '+t.undo;$('reBtn').textContent='🔀 '+t.rearrange;$('restartBtn').textContent='⟲ '+t.restart;$('newBtn').textContent=(won?'🌸 ':'＋ ')+t.newBoard;
 $('hintBtn').disabled=won;$('undoBtn').disabled=!history.length;$('reBtn').disabled=won;$('restartBtn').disabled=!history.length;$('newBtn').classList.toggle('primary',won);
 $('confirm').hidden=!confirming;$('confirmText').textContent=t.confirmSize;$('confirmYes').textContent=t.yes;$('confirmNo').textContent=t.no;
 $('howTitle').textContent=t.how;$('howText').textContent=t.howText;$('gardenTitle').textContent=t.garden;$('notice').textContent=t.notice;
 $('gardenText').innerHTML=`<p>${t.cleared}</p>`+SIZES.map(s=>`<div>${t.sizes[s].split(' · ')[0]}: <b>${stats.cleared[s]||0}</b> · ${t.solo}: <b>${stats.solo[s]||0}</b></div>`).join('')+(stats.earlier?`<div>${t.earlier}: <b>${stats.earlier}</b></div>`:'');
 for(let i=0;i<tiles.length;i++){const el=tiles[i],h=H[i];
  if(!h){el.hidden=true;el.parentNode.classList.add('empty');continue;}
  el.hidden=false;el.parentNode.classList.remove('empty');const f=F[i][h-1],free=MJ.isFree(H,i);
  let cls='tile'+(free?' free':' blocked')+(i===selected?' sel':'')+(hinted.includes(i)?' hint':'');el.className=cls;
  el.style.boxShadow=stackShadow(h);el.style.transform=`translate(${-(h-1)*2.5}px,${-(h-1)*3.5}px)`;
  const key=f+':'+h;if(el._k!==key){el._k=key;el.innerHTML=MJTiles.svg(f)+(h>1?`<span class="badge">${h}</span>`:'');}
  el.setAttribute('aria-label',MJTiles.name(f,lang)+(h>1?` (${h})`:'')+(free?'':' — blocked'));el.setAttribute('aria-disabled',String(!free));}}
/* ---------- events ---------- */
$('lang').addEventListener('change',e=>{lang=e.target.value;writeLang(lang);message='';if(warn)checkState();render();});
$('size').addEventListener('change',e=>{const v=e.target.value;if(history.length&&MJ.total(H)){pendingSize=v;confirming=true;e.target.value=size;render();return;}newBoard(v);});
$('confirmYes').addEventListener('click',()=>{confirming=null;const s=pendingSize||size;pendingSize=null;newBoard(s);});
$('confirmNo').addEventListener('click',()=>{confirming=null;pendingSize=null;render();});
$('hintBtn').addEventListener('click',hint);$('undoBtn').addEventListener('click',undo);$('reBtn').addEventListener('click',rearrange);$('restartBtn').addEventListener('click',restart);
$('newBtn').addEventListener('click',()=>{if(history.length&&MJ.total(H)){confirming=true;pendingSize=size;render();return;}newBoard(size);});
/* ---------- start ---------- */
if(load()){buildBoard();message=T().restored;checkState();render();}else newBoard('small');
window.MG_MAHJONG={get H(){return H},get F(){return F},tap,hint:()=>MJ.hint(H,F,history)};
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script>
</body></html>
