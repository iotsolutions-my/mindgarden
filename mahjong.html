<script>
/* MindGarden Mahjong Solitaire core v3 — stacked (half-offset) layouts, 100 seeded levels,
   generation that is always solvable, solver, smart hints. Offline, deterministic (integer RNG). */
'use strict';
var MJ=(function(){
const NFACES=42,LEVELS=100;
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
/* Base shapes in whole-tile cells (max 7 wide x 8 tall so tiles stay large on a phone). */
const SHAPES={
 square:['####','####','####','####'],
 diamond:['..#..','.###.','#####','.###.','..#..'],
 heart:['.#.#.','#####','#####','.###.','..#..'],
 cross:['.###.','#####','#####','#####','.###.'],
 tower:['.##.','####','####','####','####','.##.'],
 house:['..##..','.####.','######','######','##..##','##..##'],
 tree:['..##..','.####.','######','..##..','.####.','######','..##..'],
 hourglass:['######','.####.','..##..','.####.','######'],
 flower:['..###..','.#####.','#######','#######','#######','.#####.','..###..'],
 butterfly:['##...##','###.###','#######','.#####.','#######','###.###','##...##'],
 turtle:['...#...','..###..','.#####.','#######','#######','#######','.#####.','.#...#.'],
 fish:['...##..','.####.#','#######','#######','.####.#','...##..'],
 pagoda:['...#...','.#####.','..###..','#######','.#####.','#######','#######'],
 bridge:['#######','#######','##...##','##...##','##...##','#######','#######'],
 star:['...#...','..###..','#######','.#####.','..###..','.##.##.','##...##'],
 cat:['#.....#','##...##','#######','#.#.#.#','#######','.#####.','..###..'],
 lotus:['...#...','.#.#.#.','#######','#######','.#####.','..###..'],
 fortress:['#.#.#.#','#######','#######','##...##','##...##','#######','#######','#.#.#.#'],
 garden:['.#####.','#######','#######','#######','#######','#######','#######','.#####.'],
 moon:['..####.','.###...','###....','###....','###....','.###...','..####.'],
 crown:['#..#..#','##.#.##','#######','#######','#######','.#####.'],
 castle:['#.#.#.#','#######','#######','#######','#######','#######','#######','###.###'],
 bigheart:['.##.##.','#######','#######','#######','#######','.#####.','..###..','...#...'],
 temple:['...#...','..###..','.#####.','#######','#######','#######','#######','#######'],
 wings:['##...##','###.###','#######','#######','#######','#######','###.###','##...##'],
 vase:['.#####.','..###..','.#####.','#######','#######','#######','#######','.#####.'],
 dragonfly:['##.#.##','#######','.#####.','#######','#######','..###..','..###..','..###..']};
const SHAPE_NAMES=Object.keys(SHAPES);
function parse(rows){const cells=[];rows.forEach((r,y)=>{for(let x=0;x<r.length;x++)if(r[x]==='#')cells.push([x,y]);});return cells;}
/* Stack layers on a base shape. 'aligned' puts a tile exactly on top (pyramid), 'offset' puts it half a tile across on 4 tiles. */
function stack(cells,maxLayers,style){let layer=cells.map(([c,r])=>({x:2*c,y:2*r}));const all=layer.map(p=>({x:p.x,y:p.y,z:0}));
 for(let z=1;z<maxLayers;z++){const st=style==='mixed'?(z%2?'offset':'aligned'):style;const set=new Set(layer.map(p=>p.x+','+p.y));const has=(x,y)=>set.has(x+','+y);let next=[];
  if(st==='offset'){for(const p of layer)if(has(p.x+2,p.y)&&has(p.x,p.y+2)&&has(p.x+2,p.y+2))next.push({x:p.x+1,y:p.y+1});}
  else{for(const p of layer)if(has(p.x-2,p.y)&&has(p.x+2,p.y)&&has(p.x,p.y-2)&&has(p.x,p.y+2))next.push({x:p.x,y:p.y});}
  if(!next.length)break;for(const p of next)all.push({x:p.x,y:p.y,z});layer=next;}
 return all;}
const overlaps=(a,b)=>Math.abs(a.x-b.x)<2&&Math.abs(a.y-b.y)<2;
function trim(P,target,rnd){P=P.slice();while(P.length>target){
  const tops=P.filter(a=>!P.some(b=>b.z>a.z&&overlaps(a,b)));const mz=Math.max(...tops.map(t=>t.z));const c=tops.filter(t=>t.z===mz);
  const kill=c[Math.floor(rnd()*c.length)];P.splice(P.indexOf(kill),1);}return P;}
/* Level settings: size, layers, stacking style, how tricky the pairing is. */
function params(level){const n=Math.max(1,Math.min(LEVELS,level|0));
 return {n,target:2*Math.round((18+0.86*(n-1))/2),maxLayers:Math.min(5,1+Math.floor((n+3)/8)),
  style:n<8?'aligned':['offset','aligned','mixed'][n%3],spread:n<15?1:n<45?2:3,distinct:n<10?1:n<40?0.8:0.65,open:n<10?[4,7]:n<40?[3,5]:[2,4]};}
function layoutFor(p,rnd){const opts=[];for(const name of SHAPE_NAMES){const cells=parse(SHAPES[name]);const full=stack(cells,p.maxLayers,p.style);if(full.length>=p.target)opts.push({name,cells,full,area:cells.length});}
 let pick;if(opts.length){opts.sort((a,b)=>a.area-b.area||(a.name<b.name?-1:1));const k=Math.min(3,opts.length);pick=opts[Math.floor(rnd()*k)];}
 else{let best=null;for(const name of SHAPE_NAMES){const cells=parse(SHAPES[name]);const full=stack(cells,5,'mixed');if(!best||full.length>best.full.length)best={name,cells,full};}pick=best;}
 let P=trim(pick.full,Math.min(p.target,pick.full.length-(pick.full.length%2)),rnd);
 P.sort((a,b)=>a.z-b.z||a.y-b.y||a.x-b.x);return {shape:pick.name,P};}
/* ---------- topology & game state ---------- */
class Board{
 constructor(P,F){this.P=P;this.F=F;const N=P.length;this.N=N;
  this.covers=[...Array(N)].map(()=>[]);this.lblk=[...Array(N)].map(()=>[]);this.rblk=[...Array(N)].map(()=>[]);
  this.ac=new Int16Array(N);this.lc=new Int16Array(N);this.rc=new Int16Array(N);this.alive=new Uint8Array(N).fill(1);this.left=N;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(i===j)continue;const a=P[i],b=P[j];
   if(b.z>a.z&&overlaps(a,b)){this.covers[j].push(i);this.ac[i]++;}
   if(b.z===a.z&&Math.abs(a.y-b.y)<2){if(b.x===a.x-2){this.lblk[j].push(i);this.lc[i]++;}if(b.x===a.x+2){this.rblk[j].push(i);this.rc[i]++;}}}}
 free(i){return this.alive[i]&&!this.ac[i]&&(!this.lc[i]||!this.rc[i]);}
 remove(i){this.alive[i]=0;this.left--;for(const k of this.covers[i])this.ac[k]--;for(const k of this.lblk[i])this.lc[k]--;for(const k of this.rblk[i])this.rc[k]--;}
 restore(i){this.alive[i]=1;this.left++;for(const k of this.covers[i])this.ac[k]++;for(const k of this.lblk[i])this.lc[k]++;for(const k of this.rblk[i])this.rc[k]++;}
 frees(){const o=[];for(let i=0;i<this.N;i++)if(this.free(i))o.push(i);return o;}
 matches(){const by=new Map(),out=[];for(const i of this.frees()){const f=this.F[i];if(!by.has(f))by.set(f,[]);by.get(f).push(i);}
  for(const l of by.values())for(let a=0;a<l.length;a++)for(let b=a+1;b<l.length;b++)out.push([l[a],l[b]]);return out;}
 key(){let s='';for(let i=0;i<this.N;i+=30){let w=0;for(let k=i;k<Math.min(i+30,this.N);k++)w=w*2+this.alive[k];s+=w.toString(36)+'.';}return s;}
}
/* Simulate a legal clearing order; returns pairs of tile indexes. spread>1 pairs recently-freed tiles, so players must uncover partners. */
function removalOrder(board,rnd,spread){for(let attempt=0;attempt<60;attempt++){const B=new Board(board.P,board.F);for(let i=0;i<board.N;i++)if(!board.alive[i])B.remove(i);
  const since=new Int32Array(B.N);let step=0;const pairs=[];let ok=true;
  while(B.left){const fr=B.frees();if(fr.length<2){ok=false;break;}step++;for(const i of fr)if(!since[i])since[i]=step;
   const w=i=>{let v=1;for(let k=0;k<spread;k++)v*=since[i];return v*(1+B.P[i].z);};
   const pick=list=>{let s=0;for(const i of list)s+=w(i);let x=rnd()*s;for(const i of list){x-=w(i);if(x<=0)return i;}return list[list.length-1];};
   const a=pick(fr),b=pick(fr.filter(i=>i!==a));pairs.push([a,b]);B.remove(a);B.remove(b);}
  if(ok)return pairs;}return null;}
function assignFaces(board,rnd,spread,distinct,facePairs){const order=removalOrder(board,rnd,spread);if(!order)return null;let faces;
 if(facePairs){faces=facePairs.slice();}else{const kinds=[...Array(NFACES).keys()];shuffle(kinds,rnd);const k=Math.max(1,Math.min(NFACES,Math.ceil(order.length*distinct)));faces=kinds.slice(0,k);const extra=shuffle(faces.slice(),rnd);let j=0;while(faces.length<order.length)faces.push(extra[j++%extra.length]);}
 shuffle(faces,rnd);const F=board.F.slice();order.forEach((pr,i)=>{F[pr[0]]=faces[i];F[pr[1]]=faces[i];});return F;}
function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* Build a level (1..100) or a daily puzzle (seed = yyyymmdd). Always the same board for the same level. */
function make(kind,id){const p=kind==='daily'?Object.assign(params(30+(id%41)),{n:0}):params(id);const rnd=rng(kind==='daily'?id*2654435761:id*7919+17);
 const {shape,P}=layoutFor(p,rnd);let best=null,bestScore=-1e9;
 for(let t=0;t<16;t++){const B=new Board(P,new Array(P.length).fill(-1));const F=assignFaces(B,rnd,p.spread,p.distinct);if(!F)continue;const m=new Board(P,F).matches().length;
  const sc=-(m<p.open[0]?(p.open[0]-m)*3:m>p.open[1]?m-p.open[1]:0);if(sc>bestScore){best=F;bestScore=sc;}if(sc===0)break;}

/* Solver: depth-first with memo and safe moves (all remaining copies of a face free). true / false / null (gave up). */

  if(d.daily)prog.daily={streak:Math.max(0,d.daily.streak|0),last:d.daily.last|0,best:Math.max(0,d.daily.best|0)};
  if(d.game&&(d.game.kind==='level'||d.game.kind==='daily')&&Number.isInteger(d.game.id))prog.game=d.game;return;}
 // earlier versions: let returning players skip ahead
 let cleared=0;const v2=JSON.parse(localStorage.getItem('mindgarden-mahjong-v2')||'null');
 if(v2&&v2.stats){for(const k in v2.stats.cleared||{})cleared+=v2.stats.cleared[k]|0;cleared+=v2.stats.earlier|0;}
 else{const v1=JSON.parse(localStorage.getItem('mindgarden-mahjong-v1')||'null');if(v1&&v1.completedRecords)cleared=Object.keys(v1.completedRecords).length;}
 prog.unlocked=Math.max(1,Math.min(MJ.LEVELS,1+cleared));}catch(e){}}
const totalStars=()=>Object.values(prog.stars).reduce((a,b)=>a+b,0);
/* ---------- game state ---------- */
let G=null; // {kind,id,P,F,B,history,helps,dims}
let selected=-1,hinted=[],busy=false,warnUndo=0,warnShown=false,els=[];
function startGame(kind,id,resume){$('win').hidden=true;$('petals').innerHTML='';const L=MJ.make(kind,id);let F=L.F;const g=resume&&prog.game&&prog.game.kind===kind&&prog.game.id===id?prog.game:null;
 if(g&&Array.isArray(g.F)&&g.F.length===L.P.length&&g.F.every(f=>Number.isInteger(f)&&f>=0&&f<MJ.NFACES))F=g.F.slice();
 const B=new MJ.Board(L.P,F);const history=[];let helps=0;
 if(g&&Array.isArray(g.removed)){for(const p of g.removed){if(!Array.isArray(p)||p.length!==2)break;const [a,b]=p;if(!(a>=0&&b>=0&&a<B.N&&b<B.N&&a!==b&&B.free(a)&&B.free(b)&&F[a]===F[b]))break;B.remove(a);B.remove(b);history.push([a,b]);}helps=Math.max(0,g.helps|0);}
 G={kind,id,P:L.P,F,B,history,helps,chapter:kind==='level'?Math.floor((id-1)/10):0};selected=-1;hinted=[];busy=false;warnUndo=0;
 prog.game={kind,id,F,removed:history,helps};save();show('game');buildBoard();setMsg(history.length?'':T().start);render();checkDead();}
function persist(){if(!G)return;prog.game={kind:G.kind,id:G.id,F:G.F,removed:G.history,helps:G.helps};save();}
/* ---------- screens ---------- */
function show(which){$('home').hidden=which!=='home';$('game').hidden=which!=='game';document.body.classList.toggle('playing',which==='game');if(which==='home')renderHome();window.scrollTo(0,0);}
function renderHome(){const t=T();document.documentElement.lang=lang==='zh'?'zh-Hans':lang==='zt'?'zh-Hant':lang;document.title='MindGarden — '+t.title;
 $('title').textContent='🀄 '+t.title;$('subtitle').textContent=t.sub;$('langLabel').textContent='🌐 '+t.language;$('lang').value=lang;
 const g=prog.game,cur=Math.min(prog.unlocked,MJ.LEVELS);
 $('contBtn').textContent='▶ '+(g&&g.kind==='level'&&g.removed&&g.removed.length?fmt(t.resume,{n:g.id}):fmt(t.playLevel,{n:cur}));
 $('allDone').hidden=!(prog.stars[MJ.LEVELS]);$('allDone').textContent=t.allDone;
 const done=prog.daily.last===today();$('dailyTitle').textContent='🌅 '+t.daily;
 $('dailyBtn').textContent=done?t.dailyDone:(g&&g.kind==='daily'&&g.id===today()&&g.removed&&g.removed.length?'▶ '+t.cont:'▶ '+t.dailyPlay);$('dailyBtn').disabled=done;
 const st=(prog.daily.last===today()||prog.daily.last===yesterday())?prog.daily.streak:0;$('streak').textContent=st?'🔥 '+fmt(t.streak,{n:st}):t.noStreak;
 const ts=totalStars();let stage=0;for(let i=0;i<STAGE_AT.length;i++)if(ts>=STAGE_AT[i])stage=i;
 $('gardenTitle').textContent='🌿 '+t.garden+' · '+t.stages[stage];$('gardenStars').textContent=`★ ${ts} / 300 ${t.stars}`;
 $('gardenBar').style.width=Math.min(100,ts/3)+'%';
 const fl=[];for(let c=0;c<10;c++){let s=0;for(let n=c*10+1;n<=c*10+10;n++)s+=prog.stars[n]||0;const bloom=Math.floor(s/6);for(let k=0;k<bloom;k++)fl.push(CH_EMOJI[c]);}
 $('gardenFlowers').textContent=fl.length?fl.join(''):'🌱';
 const L=[];for(let c=0;c<10;c++){let s=0;for(let n=c*10+1;n<=c*10+10;n++)s+=prog.stars[n]||0;
  L.push(`<section class="chapter" style="--tint:${CH_TINT[c]}"><h3>${CH_EMOJI[c]} ${c+1}. ${t.chapters[c]} <small>★ ${s}/30</small></h3><div class="lvls">`);
  for(let n=c*10+1;n<=c*10+10;n++){const lock=n>prog.unlocked,stars=prog.stars[n]||0,isNext=n===prog.unlocked&&!stars;
   L.push(`<button type="button" class="lvl${lock?' locked':''}${isNext?' next':''}" data-lvl="${n}" ${lock?'disabled':''} aria-label="${levelLabel(n)}${lock?' 🔒':''}"><b>${lock?'🔒':n}</b><span>${lock?'':'★'.repeat(stars)+'☆'.repeat(3-stars)}</span></button>`);}
  L.push('</div></section>');}
 $('chapters').innerHTML=L.join('');$('howTitle').textContent=t.how;$('howText').textContent=t.howText;$('notice').textContent=t.notice;}
/* ---------- board layout ---------- */
function buildBoard(){const root=$('board');root.innerHTML='';els=[];
 const order=G.P.map((p,i)=>i).sort((a,b)=>G.P[a].z-G.P[b].z||G.P[a].y-G.P[b].y||G.P[a].x-G.P[b].x);
 order.forEach((i,k)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.style.zIndex=String(k+1);b.innerHTML=MJTiles.svg(G.F[i]);b.addEventListener('click',()=>tap(i));root.appendChild(b);els[i]=b;});
 $('stage').style.background=G.kind==='level'?CH_TINT[G.chapter]:'#f6f0df';layout();}
function layout(){if(!G)return;const st=$('stage'),W=st.clientWidth-12,Hh=st.clientHeight-12;
 const maxX=Math.max(...G.P.map(p=>p.x)),maxY=Math.max(...G.P.map(p=>p.y)),maxZ=Math.max(...G.P.map(p=>p.z));
 const cols=maxX/2+1,rows=maxY/2+1;const k=0.085;
 let tw=Math.min(W/(cols+maxZ*k),Hh/(rows*4/3+maxZ*k),110);tw=Math.max(24,Math.floor(tw));const th=Math.round(tw*4/3),dz=Math.max(2,Math.round(tw*k));
 const bw=cols*tw+maxZ*dz,bh=rows*th+maxZ*dz;const root=$('board');root.style.width=bw+'px';root.style.height=bh+'px';
 G.dims={tw,th,dz};
 G.P.forEach((p,i)=>{const e=els[i];e.style.width=tw+'px';e.style.height=th+'px';e.style.left=(p.x/2*tw+(maxZ-p.z)*dz)+'px';e.style.top=(p.y/2*th+(maxZ-p.z)*dz)+'px';
  e.style.setProperty('--d',dz+'px');e.style.borderRadius=Math.round(tw*0.13)+'px';});}
window.addEventListener('resize',()=>{if(G&&!$('game').hidden)layout();});
/* ---------- rendering ---------- */
let msg='';function setMsg(m){msg=m;}
function render(){const t=T();if(!G)return;const B=G.B;
 $('lvlTitle').textContent=G.kind==='daily'?'🌅 '+t.daily:(CH_EMOJI[G.chapter]+' '+levelLabel(G.id));
 $('pairsLeft').textContent=fmt(t.pairs,{n:B.left/2});$('backBtn').textContent='← '+t.levels;
 $('hintBtn').innerHTML='💡<span>'+t.hint+'</span>';$('undoBtn').innerHTML='↶<span>'+t.undo+'</span>';$('shufBtn').innerHTML='🔀<span>'+t.shuffle+'</span>';$('restBtn').innerHTML='⟲<span>'+t.restart+'</span>';
 $('undoBtn').disabled=!G.history.length||busy;$('restBtn').disabled=!G.history.length||busy;$('hintBtn').disabled=!B.left||busy;$('shufBtn').disabled=!B.left||busy;
 for(let i=0;i<B.N;i++){const e=els[i];if(!B.alive[i]){if(!e.classList.contains('gone'))e.hidden=true;continue;}e.hidden=false;
  e.className='tile'+(B.free(i)?' free':' blocked')+(i===selected?' sel':'')+(hinted.includes(i)?' hint':'');
  e.setAttribute('aria-label',MJTiles.name(G.F[i],lang)+(B.free(i)?'':' — blocked'));}
 $('msg').textContent=msg;$('warn').hidden=!warnUndo&&!warnShown;$('warnText').textContent=t.deadEnd;$('warnBtn').hidden=!warnUndo;$('warnBtn').textContent=fmt(t.undoN,{n:warnUndo});
 const stuck=B.left&&!B.matches().length&&!busy;$('stuck').hidden=!stuck;$('stuckTitle').textContent=t.stuckTitle;$('stuckText').textContent=t.stuckText;$('stuckShuf').textContent='🔀 '+t.shuffle;$('stuckUndo').textContent='↶ '+t.undo;$('stuckUndo').disabled=!G.history.length;}
/* ---------- play ---------- */
function tap(i){if(busy||!G)return;const B=G.B;if(!B.alive[i])return;
 if(!B.free(i)){setMsg(T().blocked);wiggle(i);render();return;}
 if(selected===-1){selected=i;setMsg(T().pick);render();return;}
 if(selected===i){selected=-1;setMsg('');render();return;}
 if(G.F[selected]!==G.F[i]){setMsg(T().notMatch);wiggle(i);selected=i;render();return;}
 const a=selected,b=i;selected=-1;hinted=[];busy=true;els[a].classList.add('gone');els[b].classList.add('gone');
 setTimeout(()=>{B.remove(a);B.remove(b);els[a].hidden=els[b].hidden=true;els[a].classList.remove('gone');els[b].classList.remove('gone');G.history.push([a,b]);busy=false;setMsg(T().match);warnUndo=0;warnShown=false;persist();
  if(!B.left){win();return;}render();setTimeout(checkDead,30);},260);}
function wiggle(i){const e=els[i];e.classList.remove('wig');void e.offsetWidth;e.classList.add('wig');}
function checkDead(){if(!G||!G.B.left)return;const B=G.B;if(!B.matches().length){render();return;}
 if(MJ.solvable(B,15000)===false){const h=MJ.hint(B,G.history,500);warnUndo=h.undo||0;warnShown=true;render();}}
function undo(n){if(busy||!G)return;n=n||1;for(let k=0;k<n&&G.history.length;k++){const [a,b]=G.history.pop();G.B.restore(a);G.B.restore(b);}G.helps++;selected=-1;hinted=[];warnUndo=0;warnShown=false;setMsg(T().undone);persist();render();setTimeout(checkDead,30);}
function restart(){if(busy||!G)return;for(const [a,b] of G.history){G.B.restore(a);G.B.restore(b);}G.history=[];G.helps++;
 // restore the level's original faces too (undoing any shuffle)
 const L=MJ.make(G.kind,G.id);G.F=L.F;G.B=new MJ.Board(G.P,G.F);for(let i=0;i<G.B.N;i++)els[i].innerHTML=MJTiles.svg(G.F[i]);
 selected=-1;hinted=[];warnUndo=0;warnShown=false;setMsg(T().restarted);persist();render();}
function shuffleTiles(){if(busy||!G||!G.B.left)return;const NF=MJ.reshuffle(G.B,(Date.now()^(G.B.left*7919))>>>0);if(!NF)return;
 for(let i=0;i<G.B.N;i++)if(G.B.alive[i]&&NF[i]!==G.F[i]){G.F[i]=NF[i];els[i].innerHTML=MJTiles.svg(NF[i]);}
 G.B.F=G.F;G.history=[];G.helps++;selected=-1;hinted=[];warnUndo=0;warnShown=false;setMsg(T().reshuffled);persist();render();}
function hint(){if(busy||!G||!G.B.left)return;G.helps++;const h=MJ.hint(G.B,G.history,700);
 if(h.pair){hinted=h.pair;selected=-1;setMsg(fmt(T().hintMsg,{name:MJTiles.name(G.F[h.pair[0]],lang)}));}
 else{hinted=[];warnUndo=h.undo||0;warnShown=true;}persist();render();}
function win(){const t=T();const stars=G.helps===0?3:G.helps<=3?2:1;
 if(G.kind==='level'){prog.stars[G.id]=Math.max(prog.stars[G.id]||0,stars);prog.unlocked=Math.min(MJ.LEVELS,Math.max(prog.unlocked,G.id+1));}
 else{const d=prog.daily;if(d.last!==today()){d.streak=d.last===yesterday()?d.streak+1:1;d.last=today();d.best=Math.max(d.best,d.streak);}}
 prog.game=null;save();
 $('winStars').innerHTML=[1,2,3].map(k=>`<span class="${k<=stars?'on':''}" style="animation-delay:${k*0.25}s">★</span>`).join('');
 $('winTitle').textContent=G.kind==='daily'?t.wonDaily:t.won;
 $('winNote').textContent=G.kind==='daily'?'🔥 '+fmt(t.streak,{n:prog.daily.streak}):t.starNote[stars];
 const hasNext=G.kind==='level'&&G.id<MJ.LEVELS;$('winNext').hidden=!hasNext;$('winNext').textContent=t.next;$('winHome').textContent=G.kind==='daily'?t.home:t.toLevels;
 $('win').hidden=false;petals();render();}
function petals(){const box=$('petals');box.innerHTML='';if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const set=['🌸','🌼','🌺','🍃','🌷'];for(let k=0;k<26;k++){const s=document.createElement('span');s.textContent=set[k%set.length];s.style.left=(Math.random()*100)+'%';s.style.animationDelay=(Math.random()*1.5)+'s';s.style.fontSize=(18+Math.random()*18)+'px';box.appendChild(s);}}
/* ---------- events ---------- */
$('lang').addEventListener('change',e=>{lang=e.target.value;writeLang(lang);renderHome();});
$('contBtn').addEventListener('click',()=>{const g=prog.game;if(g&&g.kind==='level'&&g.removed&&g.removed.length)startGame('level',g.id,true);else startGame('level',Math.min(prog.unlocked,MJ.LEVELS),true);});
$('dailyBtn').addEventListener('click',()=>startGame('daily',today(),true));
$('chapters').addEventListener('click',e=>{const b=e.target.closest('[data-lvl]');if(!b||b.disabled)return;startGame('level',+b.dataset.lvl,true);});
$('backBtn').addEventListener('click',()=>{persist();G=null;show('home');});
$('hintBtn').addEventListener('click',hint);$('undoBtn').addEventListener('click',()=>undo(1));$('shufBtn').addEventListener('click',shuffleTiles);$('restBtn').addEventListener('click',restart);
$('warnBtn').addEventListener('click',()=>undo(warnUndo));$('stuckShuf').addEventListener('click',shuffleTiles);$('stuckUndo').addEventListener('click',()=>undo(1));
$('winNext').addEventListener('click',()=>{$('win').hidden=true;startGame('level',G.id+1,false);});
$('winHome').addEventListener('click',()=>{$('win').hidden=true;G=null;show('home');});
/* ---------- start ---------- */
load();show('home');
window.MG_MAHJONG={get G(){return G},tap,startGame,hint:()=>MJ.hint(G.B,G.history),prog:()=>prog};
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script>
</body></html>
