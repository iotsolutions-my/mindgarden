// One challenge mode: layers increase gently with play rather than using a difficulty selector.
function layerCount(n){return n<=2?4:5;}

// Improve decisions throughout the board, not only at the opening.

  for(let k=0;k<stage;k++)for(const id of pairOrder[k]){const t=arr.find(t=>nodeId(t)===id);if(t)t.gone=true;}

function buildBoard(positions,faces){

function availableMatchesFor(arr){const free=arr.filter(t=>freeTile(t,arr));const out=[];for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)if(free[i].v===free[j].v)out.push([nodeId(free[i]),nodeId(free[j])]);return out;}

function rearrange(){if(!remaining())return;helpUsed=true;const left=live();const faces=[];for(const face of [...new Set(left.map(t=>t.v))]){const count=left.filter(t=>t.v===face).length;if(count%2){message=L[language].nohint;render();return;}for(let k=0;k<count/2;k++)faces.push(face);}
